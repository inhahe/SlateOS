[package]
name = "route"
version = "0.1.0"
edition = "2024"
description = "SlateOS routing table management"
[dependencies]
# getopt's wording, shared. net-tools' `route` uses it verbatim for an
# unrecognised option, unlike its own `ifconfig`, which does not.
usageerror = { path = "../usageerror" }
# The kernel's native error codes: SYS_NET_IF_CONFIG refuses with its own
# numbers (PermissionDenied is -400), not Linux's errno.
kerror = { path = "../kerror" }
