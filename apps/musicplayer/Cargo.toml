[package]
name = "musicplayer"
version = "0.1.0"
edition = "2024"
# Not "audio playback": nothing in this tree can produce sound, and the
# description was the only place in the repository the word appeared.
description = "SlateOS Playlist Editor — build and save .m3u playlists"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# A playlist replaces a file the user chose; `fs::write` truncates it
# first. The read is capped because an .m3u is handed to us by whoever
# wrote it.
safeio = { path = "../safeio" }

# What an audio file is and says -- its length, rate and tags -- shared with
# the explorer's audio columns.
audiotags = { path = "../audiotags" }
# A song named by its file is shown by its bytes: what is not UTF-8, or is a
# control character, written as an escape rather than lost.
quoting = { path = "../../userspace/quoting" }

[dev-dependencies]
# `appearance::palette_check`.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
