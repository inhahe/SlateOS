[package]
name = "lockscreen"
version = "0.1.0"
edition = "2024"
description = "SlateOS Lock Screen — secure graphical lock screen with clock, password entry, and multi-user support"
[dependencies]
guitk = { path = "../../gui/toolkit" }
# The password hash, and the constant-time comparison it is checked with. This
# file used to carry its own copy of both.
sha2 = { path = "../../sha2" }
# The password derivation: salt, stretching, and the stored verifier. This
# file used to keep a bare unsalted SHA-256 of the password, which is both
# weaker than and incompatible with what the credential store produces.
pwkdf = { path = "../../pwkdf" }
# The window and its event loop. Without this the whole program was
# unreachable: `fn main` was empty.
oswindow = { path = "../../gui/window" }
# The zone the clock is rendered through. UTC today, explicitly and
# greppably -- see `set_time_from_utc`.
tzrules = { path = "../../tzrules" }
# The one place SlateOS answers "is this the user's password?". This screen
# had a `PasswordAuthority` trait and no production implementor, so `main`
# would have had to pass `None` -- which is `AuthOutcome::Unusable` forever,
# i.e. a screen that locks a session nothing can unlock. `authlib` reads
# `/etc/users.yaml` and `/etc/shadow`, applies the shared faillock tally, and
# returns the six outcomes this screen's `AuthOutcome` already mirrors
# one-for-one. See `SystemAuthority`.
authlib = { path = "../../userspace/authlib" }
# The user list on the screen, and whether an account has a password at all.
# The same store `authlib` resolves against, read through the same library, so
# the names offered cannot drift from the names that can answer. See
# `system_users`.
userdb = { path = "../../userspace/userdb" }

# Test-only. The fixtures here write a `users.yaml` or a shadow line and read
# it back over the code that decides who gets in, so two tests naming one file
# would make each assert against the other's data. Same reason `authlib` uses
# it. See that crate's module docs.
[dev-dependencies]
scratchdir = { path = "../../userspace/scratchdir" }
# Test-only. The end-to-end "the right password opens the screen" test needs a
# stored entry, and it computes one with the same hasher `authlib` will
# recompute it with rather than pasting a literal -- a pasted `$6$` string is a
# test that keeps passing after the hasher it was copied from has changed.
posix = { path = "../../posix" }

[lints]
workspace = true
