[package]
name = "credentials"
version = "0.1.0"
edition = "2024"
description = "SlateOS Credential Manager — secure credential storage service"

[dependencies]
# SHA-256, shared rather than hand-copied. See the workspace `members`
# comment on `sha2`. Still needed directly: the stream cipher keys itself on
# SHA-256, which is not a password derivation and so does not belong in
# `pwkdf`.
sha2 = { path = "../../sha2" }
# The salted, stretched password derivation, shared with `apps/lockscreen`
# rather than written twice. Two independently-correct derivations would still
# be *incompatible*, and reconciling them after they are wired together invites
# weakening one to match the other. See `pwkdf`'s module doc.
pwkdf = { path = "../../pwkdf" }
# Uniform integer/slice sampling, shared rather than hand-copied. The
# generator here used `% bound`, which is where the serious modulo-bias bug
# lives; `randrange` rejects the skewed tail instead.
randrange = { path = "../../randrange" }

[lints]
workspace = true
