[package]
name = "hangman"
version = "0.1.0"
edition = "2024"

[dependencies]
# The toolkit's buttons at a game's size, and the legibility reader
# (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = HangmanApp::new();` -- it drew
# a picture of a keyboard that nothing could click, into a buffer nothing
# displayed, and exited.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
