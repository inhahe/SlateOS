[package]
name = "login-cli"
version = "0.1.0"
edition = "2024"
description = "SlateOS login - user login program"

# The libc's `crypt(3)`. `login`, `passwd` and `chpasswd` read and write the
# same `/etc/shadow`, and while each implemented the hash format itself they
# disagreed: a password set with `passwd` could not be used to log in. The
# format now has exactly one implementation, and this dependency is what
# makes that true rather than aspirational. See
# `requests/c-b-passwd-and-login-disagree-about-etc-shadow.md`.
#
# `authlib` is the same lesson one level up: which stored entry answers for a
# username, how `/etc/shadow` is parsed, and what a non-verifiable entry means
# are decisions this file used to make privately and now only consumes. See
# `design-decisions.md` §341.
[dependencies]
authlib = { path = "../authlib" }
posix = { path = "../../posix" }
# The account store. `design-decisions.md` §353 settles that `/etc/users.yaml`
# is the truth and `/etc/passwd` and `/etc/shadow` are *generated* from it, so
# a program that authenticated out of those two files was authenticating out of
# a copy. It also removes a whole class of state this file used to handle: an
# account cannot be in one file and missing from the other when there is one
# file.
userdb = { path = "../userdb" }

[dev-dependencies]
# The account lookup is exercised against a real database in a scratch
# directory rather than against a parser, because what changed is *which file
# answers*, and a parser test cannot see that.
scratchdir = { path = "../scratchdir" }
