[package]
name = "charwidth"
version = "0.1.0"
edition = "2024"
description = "wcwidth: how many terminal columns a character occupies, for the shell and the utilities that must lay text out on the same screen."

[lib]
path = "src/lib.rs"

[lints]
workspace = true

# No dependencies, deliberately and permanently: the C library links this crate
# for wcwidth (see the note at the top of src/lib.rs), so a dependency here is a
# dependency of every C program, and it builds with `core` alone.
