[package]
name = "checkers"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = CheckersApp::new();` -- it
# built the opening position and dropped it, so no board ever reached a
# screen and no click ever arrived.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
