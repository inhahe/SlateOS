# The third-party data userspace/charwidth carries (design-decisions 1433),
# read by scripts/gather-notices.py.
#
# The ZERO_WIDTH and WIDE tables in src/lib.rs are generated by
# scripts/charwidth-gen.py from three files of the Unicode Character Database
# (UnicodeData.txt, EastAsianWidth.txt, PropList.txt), pinned by SHA-256. The
# Unicode licence asks for its notice with every copy of the data files, or in
# the documentation, and a table derived from them is a modified copy -- so
# the notice travels with every program that reads the table, which is every
# program that lays text out in columns, and the terminal. When the generator
# moves to a newer Unicode version, the version below moves with it.
Unicode Character Database:
  version: 18.0.0
  licence: Unicode-3.0
  texts:
    - Unicode-3.0
