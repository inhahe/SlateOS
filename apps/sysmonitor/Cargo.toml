[package]
name = "sysmonitor"
version = "0.1.0"
edition = "2024"
description = "SlateOS System Monitor — graphical dashboard for CPU, memory, disk, network, and process monitoring"
[dependencies]
pathtext = { path = "../pathtext" }
# Text from outside -- a name, a path, what the kernel reports -- shown by its
# bytes, as escapes where it is not printable text, never lossily.
quoting = { path = "../../userspace/quoting" }
# `kill(2)` is stateful and therefore reachable only through the C ABI,
# per design-decisions 768. `libcall` is that door.
libcall = { path = "../../libcall" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# The shared `/proc` reader, so this window and `apps/procexplorer` cannot
# drift into two parsers of the same file.
procinfo = { path = "../../procinfo" }
# Whether a key is plain, a Ctrl chord or typing: a key held with Alt or the
# Windows key is not the monitor's, and AltGr is not Ctrl.
textline = { path = "../textline" }

[lints]
workspace = true
