[package]
name = "diff"
version = "0.1.0"
edition = "2024"
description = "SlateOS file comparison utility"
[dependencies]
# One rendering of untrusted text inside a diagnostic. The two paths diff is
# given are argv words, and a path may hold any byte but `/` and NUL --
# including a newline. A message that pastes one in raw lets whoever named
# the file write extra lines of this program's stderr, which for diff is
# doubly bad because its stdout is a patch someone will apply. See
# `userspace/quoting`.
quoting = { path = "../quoting" }
