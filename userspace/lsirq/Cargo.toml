[package]
name = "lsirq"
version = "0.1.0"
edition = "2024"
description = "lsirq, util-linux 2.39.3's, ported: the kernel's interrupt counters in a libsmartcols table"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long: GNU order, abbreviations and their ambiguities.
getoptlong = { path = "../getoptlong" }
# argv is bytes; a name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# libsmartcols: the table; and what setlocale leaves in errno.
smartcols = { path = "../smartcols" }
# string_add_to_idarray for -o, strverscmp for -s IRQ, isspace,
# err_exclusive_options.
ulstrutils = { path = "../ulstrutils" }
# stdout buffered as glibc buffers it, flushed at exit without close_stdout.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor lsirq was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
