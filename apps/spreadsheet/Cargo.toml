[package]
name = "spreadsheet"
version = "0.1.0"
edition = "2024"
description = "SlateOS Spreadsheet — full-featured spreadsheet application"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it: an interrupted save would leave the
# sheet on disk as a fragment. Same reasoning as `apps/editor` and
# `apps/notes`.
safeio = { path = "../safeio" }
# "Unsaved changes -- save them?", asked the way every editor here asks it.
unsaved = { path = "../unsaved" }
# A workbook's text fields are escaped with `textfmt::tsv`, the record files'
# four escapes, which the finance ledger and the notes library share.
textfmt = { path = "../../textfmt" }

[lints]
workspace = true
