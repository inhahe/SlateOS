[package]
name = "hardlink"
version = "0.1.0"
edition = "2024"
description = "hardlink, util-linux 2.39.3's, ported: consolidate duplicate files using hard links"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long: GNU order, abbreviations and their ambiguities.
getoptlong = { path = "../getoptlong" }
# argv is bytes; a name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# err_exclusive_options, parse_size and size_to_human_string.
ulstrutils = { path = "../ulstrutils" }
# stdout buffered as glibc buffers it; warn and warnx.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor hardlink was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
# --include and --exclude, compiled as regcomp (REG_EXTENDED) compiles them.
ere = { path = "../ere" }
# util-linux's read_all, which the file comparison reads with.
ulallio = { path = "../ulallio" }
# Directories, extended attributes, statfs, FIEMAP, FICLONE, AF_ALG
# digests, signals and the locale, through the C library.
libcall = { path = "../../libcall" }
