[package]
name = "rush"
version = "0.1.0"
edition = "2024"

[dependencies]
# The toolkit's buttons at a game's size (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = RushHour::new();` — it built
# puzzle 1, dropped it and exited, so no car ever reached a screen and no key
# or click ever arrived.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
