[package]
name = "kanban"
version = "0.1.0"
edition = "2024"

[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Ctrl+E writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it.
safeio = { path = "../safeio" }
# Two windows of the board save into one file without losing each other's
# cards: random ids, a merge by id, and a watch on the file
# (design-decisions §1239).
recordfile = { path = "../recordfile" }

# The boards are kept in the user's settings directory
# (`settingsfile::config_dir`), as the notes library and the address book are.
settingsfile = { path = "../../gui/settingsfile" }

# The boards file's text fields are escaped with `textfmt::tsv`, the record
# files' four escapes.
textfmt = { path = "../../textfmt" }

# `is_plain`, `is_ctrl_chord`, `types_into_field`: a chord is neither a key of the window nor typing.
textline = { path = "../textline" }
# "Your boards could not be saved -- close anyway?", asked the way every
# editor here asks it.
unsaved = { path = "../unsaved" }

[dev-dependencies]
# `with_scratch_config`, so the tests that keep boards keep them in a scratch
# directory and never in the developer's own.
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }
# `refuse_replacing`, so a test can fail a save at the write with the boards
# still readable: a save reads the file first (design-decisions §1239).
safeio = { path = "../safeio", features = ["testing"] }

[lints]
workspace = true
