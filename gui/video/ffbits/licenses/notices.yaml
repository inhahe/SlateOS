# The third-party code gui/video/ffbits carries, read by
# scripts/gather-notices.py: one entry per upstream project, with the texts
# that must travel with any binary built from the crate.

# FFmpeg 8.1.3's libavcodec, translated into Rust: here get_bits.h,
# golomb.h and golomb.c (src/bits.rs) and vlc.c (src/vlc.rs); in
# gui/video/aac its fixed-point AAC decoder, and in gui/video/h264 its H.264
# decoder with h274.c's film grain synthesis, whose tables FFmpeg took from
# SMPTE RDD 5-2006 -- each crate's src/lib.rs lists its modules. A manifest
# names a component at a version once in the tree, so the decoders' share
# of FFmpeg 8.1.3 is named here, in the crate both are built on: no binary
# holds either without this one. FFmpeg is LGPL version 2.1 or later; the
# translations are too (design-decisions/1376 and 1377: the operator chose
# to translate FFmpeg's decoders, F-Q8 and F-Q9).
FFmpeg:
  version: n8.1.3
  licence: LGPL-2.1-or-later
  texts:
    - FFmpeg-COPYING.LGPLv2.1
