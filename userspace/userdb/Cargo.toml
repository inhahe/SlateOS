[package]
name = "userdb"
version = "0.1.0"
edition = "2024"
description = "The SlateOS user database, /etc/users.yaml — one parser, one password hash"

[lib]
path = "src/lib.rs"

# `posix` for `crypt(3)`. The native user database and `/etc/shadow` are two
# different files, but there is no reason for one system to contain two
# password-hash constructions — and it previously contained three, none of
# which agreed. See `design-decisions.md` §329 for the `/etc/shadow` half of
# the same story.
[dependencies]
posix = { path = "../../posix" }

[lints]
workspace = true

# `pwdb` is the crate the rest of the system *reads* `/etc/passwd` with, so the
# generation tests parse what they generate with it rather than with a second
# parser written here. §330 records why: a reader and a writer that disagree
# can only be seen to disagree at the step where one consumes the other.
[dev-dependencies]
pwdb = { path = "../pwdb" }
scratchdir = { path = "../scratchdir" }
