[package]
name = "firejail"
version = "0.1.0"
edition = "2024"
description = "SlateOS firejail utility"
[dependencies]

# The sandbox-file tests write into a private scratch directory rather than a
# fixed `firejail_test_*` under the system temp directory. The fixed names made
# two concurrent runs of the suite share one directory, and on Windows that is
# not a slow test but a failing one: `remove_sandbox_file` cannot unlink a file
# the other run still holds open. See known-issues.md
# `B-TEST-FIXTURES-SHARE-TEMP-PATHS-ACROSS-CONCURRENT-RUNS`.
[dev-dependencies]
scratchdir = { path = "../scratchdir" }
