[package]
name = "tac"
version = "0.1.0"
edition = "2024"
description = "SlateOS reverse line/character printer (tac/rev)"
[dependencies]
# It interpolates `arg` into "rev: unknown option {}". That value is an argv
# word, so it is whatever the user typed and not text this program chose.
quoting = { path = "../quoting" }
