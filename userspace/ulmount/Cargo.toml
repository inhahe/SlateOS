[package]
name = "ulmount"
version = "0.1.0"
edition = "2024"
description = "The part of util-linux 2.39.3's libmount that findmnt, mountpoint and swapon read mount tables with, ported"

[lints]
workspace = true

[dependencies]
# ul_optstr_next, the options-string scanner libmount is built on.
ulstrutils = { path = "../ulstrutils" }
# Paths from bytes.
quoting = { path = "../quoting" }
# lib/sysfs.c: device numbers to /dev paths, and glibc's makedev.
ulsysfs = { path = "../ulsysfs" }
# libblkid's probing: what a device holds, for tags and --verify.
ulblkid = { path = "../ulblkid" }

[dev-dependencies]
scratchdir = { path = "../scratchdir" }
