[package]
name = "breakout"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it the game played itself for nobody: `main` built a
# `BreakoutApp` and dropped it, so no tick ever moved the ball and no key
# arrived.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[lints]
workspace = true
