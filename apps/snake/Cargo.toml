[package]
name = "snake"
version = "0.1.0"
edition = "2024"

[dependencies]
# The toolkit's buttons at a game's size (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = SnakeApp::new();` — it built the
# board, placed the first food and dropped the lot, so no frame ever reached a
# screen and no key ever arrived.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
