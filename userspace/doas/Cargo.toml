[package]
name = "doas"
version = "0.1.0"
edition = "2024"
description = "SlateOS doas - lightweight privilege elevation"

# `authlib` for password verification -- the one place SlateOS answers "is this
# the user's password?". This crate was the fifth program to answer it with its
# own arithmetic: it hashed `$sha256$<salt>$<digest>` and rejected every other
# format, including the `$6$` entries `passwd` writes, so a correctly-typed
# password could never open a `doas` prompt. The `sha2` dependency existed
# solely for that hasher; the header above it claimed it "matched the passwd
# utility", which nothing checked and which had stopped being true.
[dependencies]
# It interpolates `caller_name`, `command` and `args.target_user` into
# "doas: {} is not allowed to run {} as {}". The caller name comes from the
# password database and the other two come from argv, so none of the three
# is text this program chose -- and this particular line is a security
# decision, which is the one kind of output that must not be forgeable.
quoting = { path = "../quoting" }
authlib = { path = "../authlib" }

# Tests only: they build a real `$6$` entry with the same hasher `passwd` uses,
# rather than pasting a constant that could drift away from it -- which is the
# exact way this crate's own hash came to disagree with the system's.
[dev-dependencies]
posix = { path = "../../posix" }
# And `scratchdir` for the per-test shadow files themselves: two tests naming
# one file make each assert against the other's data, over the code that decides
# whether a password is correct. See known-issues.md
# `B-FTPD-SSHD-AUTH-TESTS-SHARE-TEMP-FILES-AND-FLAKE`.
scratchdir = { path = "../scratchdir" }

# Inherit the workspace lint configuration. This crate had none at all: it was
# not in the `[lints] workspace = true` set and set no `#![deny]`/`#![warn]` of
# its own, so `unwrap_used`, `expect_used`, `indexing_slicing` and
# `arithmetic_side_effects` -- the four the workspace keeps at `warn` precisely
# because they flag real panic and overflow risks -- were silently off over code
# that decides whether a password grants privilege elevation.
[lints]
workspace = true
