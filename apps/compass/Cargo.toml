[package]
name = "compass"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The compass draws a rose, three views and a status line, and before this
# dependency existed none of it was ever shown: `main` built a `CompassApp`
# and dropped it. `oswindow` is what turns a `render` into a window a
# pointer and a keyboard can reach.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
