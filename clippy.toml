# Workspace-wide clippy configuration.
#
# NOT for the crates under `apps/`: clippy reads the nearest clippy.toml and
# does not merge it with this one, and `apps/clippy.toml` exists (it adds a
# ratchet against lossy path display). A setting added here must be added
# there too, or `apps/` will not see it.
#
# `doc-valid-idents` extends (via the `..` entry, which splices in clippy's
# own default list) the set of identifiers that `clippy::doc_markdown` will
# not demand backticks around. Without it, every doc comment that names this
# project or a piece of prior art it cites — "SlateOS", "HarfBuzz",
# "DejaVu" — is reported as a missing-backticks warning, and the only ways
# to silence it are to backtick a proper noun in running prose (which reads
# as though it were a code identifier) or to sprinkle `#[allow]`s. Neither
# is right: these are words, not items.
#
# Keep this list to genuine proper nouns that appear in prose. Anything that
# really is a type, function or file name should be backticked instead.
doc-valid-idents = [
    "SlateOS",
    "HarfBuzz",
    "FreeType",
    "DejaVu",
    "OpenType",
    "TrueType",
    "PostScript",
    "OpenGL",
    "..",
]

# `arithmetic_side_effects` exists to catch integer arithmetic that can panic
# or wrap, and it already exempts `f32`/`f64` because IEEE arithmetic does
# neither: an out-of-range result is an infinity, an invalid one a NaN.
# `ExtF80` (the software x87 80-bit float, `userspace/cprintf/src/extfloat.rs`)
# is the same IEEE arithmetic done in software, so every `a + b` on one was
# being flagged for a hazard the operation does not have. The integer
# arithmetic *inside* `extfloat.rs`, where a real overflow could live, stays
# under the lint. Three names, because clippy matches the type's printed path:
# `extfloat::ExtF80` in the crate that defines it, `cprintf::extfloat::ExtF80`
# in the programs that use it, and `coreutils::extfloat::ExtF80` in the
# coreutils binaries, which reach it through that crate's re-export (it lived
# there until 2026-10-01).
arithmetic-side-effects-allowed = ["coreutils::extfloat::ExtF80", "cprintf::extfloat::ExtF80", "extfloat::ExtF80"]
