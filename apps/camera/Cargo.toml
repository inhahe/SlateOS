[package]
name = "camera"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window itself. Camera used to be a simulation with no window at all:
# `main` ticked a few simulated frames, rendered into a `Vec` and bound the
# result to `let _`, so nothing was ever shown and no click or key ever
# reached the program.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
