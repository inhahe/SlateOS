[package]
name = "cgroup"
version = "0.1.0"
edition = "2024"
description = "SlateOS cgroup management tools"
[dependencies]
# It interpolates `group` into "cgset: {}: {name} = {value}". That value is
# an argv word, so it is whatever the user typed and not text this program
# chose.
quoting = { path = "../quoting" }
