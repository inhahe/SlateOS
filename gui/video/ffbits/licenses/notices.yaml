# The third-party code gui/video/ffbits carries, read by
# scripts/gather-notices.py: one entry per upstream project, with the texts
# that must travel with any binary built from the crate.

# FFmpeg 8.1.3's libavcodec get_bits.h, golomb.h and golomb.c (src/bits.rs)
# and vlc.c (src/vlc.rs), translated into Rust for the decoders translated
# from FFmpeg (design-decisions/1376, 1377). FFmpeg is LGPL version 2.1 or
# later; the translation is too.
FFmpeg:
  version: n8.1.3
  licence: LGPL-2.1-or-later
  texts:
    - FFmpeg-COPYING.LGPLv2.1
