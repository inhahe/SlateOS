[package]
name = "mindmap"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it.
safeio = { path = "../safeio" }

# A map's own file is YAML, as the diagram's and the whiteboard's are: every
# colour, shape, position and fold, which the outline export does not keep.
yamldoc = { path = "../../yamldoc" }

# "Unsaved changes -- save them?", asked the way every editor here asks it.
unsaved = { path = "../unsaved" }

[lints]
workspace = true
