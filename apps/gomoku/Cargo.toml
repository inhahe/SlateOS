[package]
name = "gomoku"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = GomokuApp::new();` -- it built
# the opening board, dropped it and exited, so no stone ever reached a screen
# and no click ever arrived at the game that reads clicks.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
