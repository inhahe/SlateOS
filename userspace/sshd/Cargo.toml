[package]
name = "sshd"
version = "0.1.0"
edition = "2024"
description = "SlateOS sshd - SSH server daemon"

# `sha2` for the key exchange, HMAC and fingerprints. This crate carried its
# own SHA-256, as does the client in `userspace/ssh` -- two implementations of
# one digest on the two ends of a connection, which is the arrangement where a
# divergence hides best.
#
# `posix` for `ed25519` (host key signing, publickey signature verification),
# which was previously faked here: `sign` returned an HMAC labelled
# "ssh-ed25519" and publickey auth never looked at the signature at all.
#
# `posix` is depended on for `ed25519` *only*, and that is a deliberate limit
# rather than a coincidence of what this crate needs. `ed25519` is pure
# arithmetic over caller-owned buffers, which is what makes it safe to reach as
# a Rust dependency. Anything in `posix` that talks to the kernel is not: a
# SlateOS program target is `target_os = "linux"`, every syscall in `posix` is
# gated `#[cfg(target_os = "none")]` for the bare-metal `libc.a` build, so an
# rlib copy of `posix` linked into a program answers `-ENOSYS` to every syscall
# while the real libc sits right next to it answering correctly. That is how
# this crate came to be unable to generate a host key at all. See
# known-issues.md `TD-B-THE-POSIX-RLIB-IS-A-SECOND-LIBC-WITH-EVERY-SYSCALL-STUBBED-OUT`.
#
# `randrange` for every secret this crate draws -- the host key seed, the
# OpenSSH-format `checkint`, and the Diffie-Hellman private exponent. It reaches
# the kernel CSPRNG through the linked libc's `getrandom` symbol, which is the
# one route that works from a program, and is shared with `ssh` and `ssh-keygen`
# so there is one implementation rather than three.
#
# `authlib` for password authentication -- the one place SlateOS answers "is
# this the user's password?". This crate was the *fourth* disagreeing hasher
# (design-decisions.md section 329 counted three): it hashed `$5$`/`$6$` entries
# as sha256(password || salt) in hex, which is not SHA-crypt and is not what
# `passwd` writes, and then fell through to comparing the entry as plaintext.
#
# `sshwire` for the encodings and the key-exchange arithmetic the far end has to
# agree with byte for byte. It is the `sha2` argument one layer up: this crate
# and `userspace/ssh` each had a private copy of the RFC 4253 section 8 exchange
# hash, the server's drifted to hashing a placeholder client version, and no
# client could verify the host key signature. Both suites were green. See
# known-issues.md `TD-B-THE-SSH-WIRE-LAYER-IS-WRITTEN-TWICE-AND-NOTHING-MAKES-THE-TWO-COPIES-AGREE`.
[dependencies]
sha2 = { path = "../../sha2" }
posix = { path = "../../posix" }
randrange = { path = "../../randrange" }
authlib = { path = "../authlib" }
sshwire = { path = "../sshwire" }

# `monoclock` for the login grace timer. This crate is the reason that crate
# exists: the timer read a nanosecond clock through a wrapper called
# `clock_monotonic_ms` and divided by 1000, so it compared microseconds against
# a limit in seconds and expired the default 120-second grace 120 microseconds
# after the connection opened -- no client could authenticate at all, and
# nothing reported a unit error. A unit that lives in an identifier is not
# checked by anything; `monoclock` puts it in the type. See known-issues.md
# `B-SSHD-LOGIN-GRACE-TIMER-COMPARED-MICROSECONDS-AGAINST-SECONDS`.
monoclock = { path = "../../monoclock" }

# `quoting` for `os_from_bytes`: the one place in the tree that knows how to
# turn the bytes of a path back into a name a syscall will take, on the target
# and on a Windows development host both. The config file is read as bytes here,
# because a `HostKey` line may name a file whose name is not UTF-8 -- every byte
# but `/` and NUL is a legal path byte on this OS -- and this crate would
# otherwise have written a fourth private copy of that `#[cfg(unix)]` dance. It
# has no dependencies of its own.
quoting = { path = "../quoting" }

# Test-only. The fixtures write a shadow line and read it back, so two tests
# naming one file make each assert against the other's data -- over the code
# that decides whether a password is correct. See that crate's module docs and
# known-issues.md `B-FTPD-SSHD-AUTH-TESTS-SHARE-TEMP-FILES-AND-FLAKE`.
[dev-dependencies]
scratchdir = { path = "../scratchdir" }
# And `userdb` to build the account database the fixture authenticates
# against. `design-decisions.md` §353 item 3 removed `authlib`'s `/etc/shadow`
# branch, so a fixture that wrote a shadow file was writing to a store nothing
# reads; it writes a `users.yaml` now. A dev-dependency and not a dependency:
# this crate does not read accounts itself, it asks `authlib`.
userdb = { path = "../userdb" }

# `deterministic-secrets` exposes `ConnectionState::with_secret_source`, which
# lets a caller replace the source this daemon draws its Diffie-Hellman
# exponent, KEXINIT cookie and packet padding from.
#
# It is a Cargo feature rather than a plain `pub fn` because a feature is
# *absent* from a build that does not ask for it, and the only thing that asks
# is the interop test crate, through its `dev-dependencies`. A release artifact
# does not compile dev-dependencies, so it does not contain this method at all
# -- a stronger statement than "nothing calls it", and the right strength for a
# method whose misuse is a server negotiating a key an observer can predict.
# `cfg(test)` cannot serve here because it is per-crate, and the interop test is
# a different crate.
#
# Nothing in any crate's `[dependencies]` enables it, so no ordinary build can
# turn it on through feature unification.
[features]
deterministic-secrets = []

# This crate is a library with a three-line binary on top, and the split is
# load-bearing rather than cosmetic: a binary crate has no rlib for another
# crate to link, so while the daemon was a `main.rs` no test could drive the
# real client against it. Six bugs have now come out of the two ends of this
# protocol disagreeing while each end's own suite passed. See the library's
# module docs and known-issues.md
# `TD-B-THE-SSH-WIRE-LAYER-IS-WRITTEN-TWICE-AND-NOTHING-MAKES-THE-TWO-COPIES-AGREE`.
[lib]
name = "sshd"
path = "src/lib.rs"

[[bin]]
name = "sshd"
path = "src/main.rs"

[lints]
workspace = true
