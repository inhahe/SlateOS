[package]
name = "kill"
version = "0.1.0"
edition = "2024"
description = "SlateOS process termination utility"
[build-dependencies]
# Tells cargo that the hand-built sysroot libc.a is an input, so a
# libc rebuild relinks these binaries instead of silently leaving them
# stale. See userspace/sysroot-dep.
sysroot-dep = { path = "../sysroot-dep" }

[dependencies]
# The 128+N convention for "killed by signal N". Three crates carried it as
# bare literals and one of them wrote 9 where 137 was meant.
killconv = { path = "../../killconv" }
procinfo = { path = "../../procinfo" }
# Both messages name a process the user asked for by name, and a process
# name comes from the target's own argv -- so it is not even this user's
# text.
quoting = { path = "../quoting" }
