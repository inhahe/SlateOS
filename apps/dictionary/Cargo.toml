[package]
name = "dictionary"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` built a `DictionaryApp`, dropped it and exited:
# no definition ever reached a screen, and no key or click ever arrived.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
