[package]
name = "habits"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }
# Whether a key types or is a command: a chord arrives carrying its letter,
# and AltGr arrives as Ctrl+Alt and types.
textline = { path = "../textline" }

# The habits and every check-in, kept between runs in the user's settings.
settingsfile = { path = "../../gui/settingsfile" }
yamldoc = { path = "../../yamldoc" }

# "Today" is the clock's, in the local zone (design-decisions 1201).
tzrules = { path = "../../tzrules" }

[dev-dependencies]
# A test names a path in its failure message the way the window would.
pathtext = { path = "../pathtext" }
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
