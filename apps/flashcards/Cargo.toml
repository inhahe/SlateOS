[package]
name = "flashcards"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The keys a one-line field answers, shared rather than copied.
textline = { path = "../textline" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it.
safeio = { path = "../safeio" }

# The zone rules, so "due today" is judged against the user's midnight
# rather than UTC's.
tzrules = { path = "../../tzrules" }

# Where the decks are kept: a directory of deck files under the user's
# settings (`settingsfile::config_dir`).
settingsfile = { path = "../../gui/settingsfile" }

[dev-dependencies]
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
