[package]
name = "cfdisk"
version = "0.1.0"
edition = "2024"
description = "cfdisk, util-linux 2.39.3's, ported: display or manipulate a disk partition table, full screen"

[lints]
workspace = true

[dependencies]
# The library: labels, partitions, dialogs, scripts.
libfdisk = { path = "../libfdisk" }
# The shared standard output, and its exit.
fdisk = { path = "../fdisk" }
# ncursesw, as Ubuntu builds cfdisk with it.
curses = { path = "../curses" }
# The partition table and the extra information as text, and the widths
# and alignment of the menus' strings (lib/mbsalign.c).
smartcols = { path = "../smartcols" }
# libmount: where a partition is mounted, or would be.
ulmount = { path = "../ulmount" }
# glibc's getopt_long: GNU order, abbreviations and their ambiguities.
getoptlong = { path = "../getoptlong" }
# argv is bytes; a name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# lib/colors.c.
ulcolors = { path = "../ulcolors" }
# parse_size, size_to_human_string.
ulstrutils = { path = "../ulstrutils" }
# Standard error, unbuffered.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor cfdisk was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
# Paths from bytes.
ulsysfs = { path = "../ulsysfs" }
# blkdev_lock.
ulblkid = { path = "../ulblkid" }
# strerror's wording for %m.
errmsg = { path = "../errmsg" }
# The locale, signals, the window's size.
libcall = { path = "../../libcall" }
