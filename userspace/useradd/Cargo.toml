[package]
name = "useradd"
version = "0.1.0"
edition = "2024"
[dependencies]
# The account store. `design-decisions.md` §353 settles that `/etc/users.yaml`
# is the truth and `/etc/passwd` and `/etc/shadow` are generated from it. This
# binary used to write both flat files by hand, which meant an account it
# created was deleted again by the next save from any other tool -- the account
# was never in the database those files are generated from. Groups are not part
# of §353 and `/etc/group` and `/etc/gshadow` are still written here directly.
userdb = { path = "../userdb" }

# `TestEnv` drew its directory name from a process-wide counter alone. A counter
# separates the threads of one run, which is the axis a clock misses — but it
# resets to 0 in every run, so two concurrent runs walk the same names in the
# same order, and `TestEnv::new` opens by `remove_dir_all`-ing the path. Each
# run therefore deletes the other's `/etc/shadow` stand-in mid-test. See
# known-issues.md `B-TEST-FIXTURES-SHARE-TEMP-PATHS-ACROSS-CONCURRENT-RUNS`.
[dev-dependencies]
scratchdir = { path = "../scratchdir" }
