[package]
name = "sshd"
version = "0.1.0"
edition = "2024"
description = "SlateOS sshd - SSH server daemon"

# `sha2` for the key exchange, HMAC and fingerprints. This crate carried its
# own SHA-256, as does the client in `userspace/ssh` -- two implementations of
# one digest on the two ends of a connection, which is the arrangement where a
# divergence hides best.
#
# `posix` for `ed25519` (host key signing, publickey signature verification),
# which was previously faked here: `sign` returned an HMAC labelled
# "ssh-ed25519" and publickey auth never looked at the signature at all.
#
# `posix` is depended on for `ed25519` *only*, and that is a deliberate limit
# rather than a coincidence of what this crate needs. `ed25519` is pure
# arithmetic over caller-owned buffers, which is what makes it safe to reach as
# a Rust dependency. Anything in `posix` that talks to the kernel is not: a
# SlateOS program target is `target_os = "linux"`, every syscall in `posix` is
# gated `#[cfg(target_os = "none")]` for the bare-metal `libc.a` build, so an
# rlib copy of `posix` linked into a program answers `-ENOSYS` to every syscall
# while the real libc sits right next to it answering correctly. That is how
# this crate came to be unable to generate a host key at all. See
# known-issues.md `TD-B-THE-POSIX-RLIB-IS-A-SECOND-LIBC-WITH-EVERY-SYSCALL-STUBBED-OUT`.
#
# `randrange` for every secret this crate draws -- the host key seed, the
# OpenSSH-format `checkint`, and the Diffie-Hellman private exponent. It reaches
# the kernel CSPRNG through the linked libc's `getrandom` symbol, which is the
# one route that works from a program, and is shared with `ssh` and `ssh-keygen`
# so there is one implementation rather than three.
#
# `authlib` for password authentication -- the one place SlateOS answers "is
# this the user's password?". This crate was the *fourth* disagreeing hasher
# (design-decisions.md section 329 counted three): it hashed `$5$`/`$6$` entries
# as sha256(password || salt) in hex, which is not SHA-crypt and is not what
# `passwd` writes, and then fell through to comparing the entry as plaintext.
[dependencies]
sha2 = { path = "../../sha2" }
posix = { path = "../../posix" }
randrange = { path = "../../randrange" }
authlib = { path = "../authlib" }

# Test-only. The fixtures write a shadow line and read it back, so two tests
# naming one file make each assert against the other's data -- over the code
# that decides whether a password is correct. See that crate's module docs and
# known-issues.md `B-FTPD-SSHD-AUTH-TESTS-SHARE-TEMP-FILES-AND-FLAKE`.
[dev-dependencies]
scratchdir = { path = "../scratchdir" }

[lints]
workspace = true
