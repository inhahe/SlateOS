[package]
name = "settings"
version = "0.1.0"
edition = "2024"
description = "SlateOS Settings — centralized system configuration UI"
[dependencies]
guitk = { path = "../../gui/toolkit" }
# The Personalization pages edit the same preferences the desktop shell paints
# from, so they share one model and one file rather than each keeping a copy.
# See known-issues.md TD-THREE-INDEPENDENT-APPEARANCE-MODELS.
appearance = { path = "../../gui/appearance" }
# The Mouse page, on exactly the same terms: the compositor is what decides
# whether two clicks are one double click, so the value has to travel through a
# file both processes read rather than living in this application.
inputsettings = { path = "../../gui/inputsettings" }

# Which programs may interrupt the user. The desktop shell reads what
# this page writes; see gui/notifsettings.
# The machine's real user accounts, for the Accounts page. The same crate the
# login screen and apps/lockscreen read, because two answers to "which accounts
# does this machine have" drift and a person cannot tell a hidden account from
# a deleted one. This page used to carry three invented ones.
loginusers = { path = "../../gui/loginusers" }

notifsettings = { path = "../../gui/notifsettings" }
# The window and the event loop. Settings names `oswindow`, never `guiremote` —
# an application should no more name the display protocol than a Unix program
# names the socket layer.
oswindow = { path = "../../gui/window" }

# The real compositor, for the one test module that puts the shipped code on
# *both* ends of the display protocol. A test against a stand-in compositor and
# a test against a stand-in client can both pass while the two real halves
# disagree; this is what closes that gap. A dev-dependency, so the shipped
# Settings binary does not link a display server.
[dev-dependencies]
compositor = { path = "../../gui/compositor" }

# `settingsfile::testing` -- reached here as `appearance::config::testing` -- for the tests that
# run against a scratch configuration directory instead of the developer's
# own. Cargo unifies this with the ordinary dependency when building tests,
# so the module exists for `cargo test` and nowhere else.
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
