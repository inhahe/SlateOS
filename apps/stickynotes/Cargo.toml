[package]
name = "stickynotes"
version = "0.1.0"
edition = "2024"
description = "SlateOS sticky notes — a desktop of movable, resizable notes"
[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window and its event loop. Without this `fn main` was empty, so every
# note, every drag and the whole undo stack existed only for the tests to call.
oswindow = { path = "../../gui/window" }
# Where the notes file lives. Only `config_dir` is used — the notes are not
# YAML — but the answer to "which directory?" belongs in one place.
settingsfile = { path = "../../gui/settingsfile" }
# The save itself. A sticky note is the user's own writing, and `fs::write`
# truncates before it writes: a crash mid-save loses every note, not one.
safeio = { path = "../safeio" }

[dev-dependencies]
# The same crate with its counters on, so a test can prove the save really went
# through `safeio` rather than quietly regressing to `std::fs::write` — the two
# leave identical bytes, so nothing else can tell them apart.
safeio = { path = "../safeio", features = ["audit"] }
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
