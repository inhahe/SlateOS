# Limine bootloader configuration.
# See: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md

timeout: 3
serial: yes

# The first entry is the one Limine starts when the timeout runs out.
# scripts/boot-test.sh gives it the test's kernel command line, on the line
# after its kernel_path, so it has to stay first.
/OS Kernel
    protocol: limine
    kernel_path: boot():/boot/kernel

# Starting for repair: the same kernel, with "single recovery" on its command
# line. The desktop reads /proc/cmdline and signs nobody in automatically when
# either word is there (design-decisions 1427); the kernel's own boot
# configuration writes the same words for its recovery entry
# (kernel/src/fs/bootcfg.rs).
/OS Kernel (recovery)
    protocol: limine
    kernel_path: boot():/boot/kernel
    cmdline: single recovery
