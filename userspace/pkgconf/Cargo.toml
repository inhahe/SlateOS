[package]
name = "pkgconf"
version = "0.1.0"
edition = "2024"
[dependencies]
# It interpolates `name` into "Package {} was not found in the pkg-config
# search path.". That value is a path from the command line, and a path may
# hold any byte but `/` and NUL -- a newline included.
quoting = { path = "../quoting" }
