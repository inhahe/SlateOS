[package]
name = "sysinfo-app"
version = "0.1.0"
edition = "2024"
description = "SlateOS System Information — hardware and OS information explorer"
[dependencies]
# The hardware reader, shared with the Device Manager.
hwquery = { path = "../hwquery" }
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }
# The keys that edit the search box, and which keys are commands rather than
# typing.
textline = { path = "../textline" }

# Export writes through `safeio::write_str_atomically`, not `fs::write`,
# which truncates the target before writing it.
safeio = { path = "../safeio" }

# The shared `/proc` reader. Its module docs name this app as one of its
# two consumers -- it was built on a request from this lane, for this
# window -- and until today it was not among this app's dependencies.
procinfo = { path = "../../procinfo" }

# Unix seconds to a UTC calendar date, for the boot time.
civildate = { path = "../../civildate" }

[dev-dependencies]
# Its fixture-tree provider, for the tests that fake /sys.
hwquery = { path = "../hwquery", features = ["testing"] }
# `appearance::palette_check`, the sweep that proves this crate draws from the
# user's palette rather than from colours of its own. Behind a feature because
# `cfg(test)` is set only when `appearance` itself is under test.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
