[package]
name = "libmagic"
version = "0.1.0"
edition = "2024"
description = "SlateOS libmagic: a port of file 5.45's library -- the magic database and the tests that identify a file"

[dependencies]
# C's printf conversions and strtod/strtof, which a magic rule's description
# and its float values are read and written with.
cprintf = { path = "../cprintf" }
# The regex engine, in the C locale a byte at a time, for `regex` rules.
ere = { path = "../ere" }
# strerror(3)'s wording for an I/O error.
errmsg = { path = "../errmsg" }
# `iswprint`: what an answer may print unescaped, by the tree's one rule.
quoting = { path = "../quoting" }
# The local time zone, for `ldate` rules and Windows times.
localtime = { path = "../localtime" }
# C's strtol, strtoul and strtoull at base 0, which the magic database's
# numbers are read with -- this crate's `cstd` until 2026-10-08.
cstrtol = { path = "../cstrtol" }

[lints]
workspace = true
