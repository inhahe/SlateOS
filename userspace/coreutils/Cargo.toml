[package]
name = "coreutils"
version = "0.1.0"
edition = "2024"
description = "Coreutils for SlateOS (86 binaries)"

[dependencies]
# `/proc` parsing lives in `procinfo`, shared with `userspace/htop`,
# `apps/procexplorer`, and `userspace/ps` until it was retired on
# 2026-09-12. See `known-issues.md` ->
# TD-B-FIFTY-PROC-READERS-DUPLICATE-WHAT-PROCINFO-ALREADY-PARSES.
procinfo = { path = "../../procinfo" }
# One regex engine for the utilities and the shell. `grep`, `sed`, `awk` and
# `expr` each used to match regular expressions with `str::contains`, so a
# bracket expression matched only a line that literally contained `[ax]` — and
# `[[ $f =~ ^a ]]` in osh and `grep '^a'` gave different answers about one file.
# See design-decisions.md §322.
ere = { path = "../ere" }
# One rendering of a file name inside a diagnostic. This was `src/quote.rs`
# until 2026-08-23 and is re-exported as `coreutils::quote`, so no bin changed.
# It moved out because a path may contain a newline — a utility that prints one
# raw lets whoever chose the name forge lines of its own error stream — and the
# 777 utility crates that do not depend on this bundle had 1798 diagnostics
# doing exactly that, with no way to call the fix. See design-decisions.md §370.
quoting = { path = "../quoting" }
# One definition of an exact integer, shared with `bc`, `dc` and `genius-cli`.
# GNU `expr` is arbitrary-precision — `expr 9223372036854775807 + 1` answers
# 9223372036854775808 — and a shell script reaches those sizes by accident.
bignum = { path = "../bignum" }
# One `wcwidth`, shared with the shell. `wc -L` reports a *display* width, not a
# character count — U+4E00 takes two columns and a combining mark takes none —
# and so do `expand`, `fold`, `nl` and `column`. All of them are laying text out
# on the same terminal as osh's `select` menu, so a disagreement about how wide
# a character is shows up as a misaligned screen. See `userspace/charwidth`.
charwidth = { path = "../charwidth" }
# One chmod-style mode string, shared with `install -m`, `mkdir -m` and the
# shell's `umask`. Four hand-written parsers of `u+X` had disagreed on thirteen
# separate rules — including whether the umask applies at all, and whether `X`
# exists — so a script that set a mode with one and checked it with another got
# two answers. See `userspace/modechange`.
modechange = { path = "../modechange" }
# One SHA-256, shared with `pkg`, `backup`, `rsync`, `ssh` and the rest. The
# `sha256sum` binary carried its own, which is the least defensible place for a
# private copy: the whole output of that utility is a digest another machine
# will compare against its own.
sha2 = { path = "../../sha2" }
# One `/etc/passwd` and `/etc/group` reader, shared with `id`, `chown`, `su` and
# the login path. A utility that prints a *name* for a uid has to agree with the
# utility that resolved that name to a uid, or `chown "$(stat -c %U f)" f` stops
# being a no-op. See `userspace/pwdb`.
pwdb = { path = "../pwdb" }
# The `OWNER[:GROUP]` operand grammar, re-exported as `coreutils::userspec`.
# Extracted from this crate on 2026-09-12 so `userspace/install` can share it
# rather than keep the third copy of a rule with this many corners.
userspec = { path = "../userspec" }
# One TZ resolution and one `strftime`, shared with `date`, `touch` and the
# shell's prompt expansion. `ls -l` renders a timestamp in the machine's zone;
# so does `date`; three private copies had disagreed about what an unset `TZ`
# means (it is `/etc/localtime`, not UTC). See `userspace/localtime`.
localtime = { path = "../localtime" }

# The logged-in user count in `uptime`'s default line. `uptime.rs` used to say
# this tree "has no utmp reader: there is no `who`, and no shared module for
# it", and omitted the field on that basis. All three halves of that were
# wrong: `utmpfile` is a workspace crate and `userspace/who`, `userspace/last`
# and `userspace/finger` already use it. The field was missing for a reason
# that had not been checked.
#
# Safe to depend on under §768 (a Rust rlib must not become a second libc):
# `utmpfile` has NO dependencies at all and its API takes bytes --
# `parse(&[u8])`, `count_user_sessions(&[u8])` -- so the caller does the I/O
# and the crate is a pure record parser, the same exemption `charwidth` and
# `quoting` hold.
utmpfile = { path = "../../utmpfile" }

# `sed`'s `w`/`W`/`R` tests write to a real file, because those commands take a
# file name as an argument and there is no way to exercise them otherwise. They
# named that file `temp_dir()/sed-w-test` and friends — one fixed path per test,
# shared with every concurrent copy of the suite, and truncated on entry. See
# known-issues.md `B-TEST-FIXTURES-SHARE-TEMP-PATHS-ACROSS-CONCURRENT-RUNS`.
[dev-dependencies]
scratchdir = { path = "../scratchdir" }
