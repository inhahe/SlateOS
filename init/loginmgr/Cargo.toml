[package]
name = "loginmgr"
version = "0.1.0"
edition = "2024"
description = "SlateOS login manager: signs people in and starts their desktop as them"

[dependencies]
# Checking a password: the verdict and the shared tally of wrong guesses that
# `login` and `su` count against too (design-decisions §341, §354).
authlib = { path = "../../userspace/authlib" }
# The account database: whom a session runs as, and its sign-ins counted.
userdb = { path = "../../userspace/userdb" }
# Which accounts a login screen offers, and which one signs in by itself --
# lane C's policy over the database, the same one the screen used to apply.
loginusers = { path = "../../gui/loginusers" }
# The service the login screen calls, and logind's.
libservicebus = { path = "../../userspace/libservicebus" }
# Waiting for the programs it starts.
libcall = { path = "../../libcall" }

[dev-dependencies]
# A database of the tests' own.
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
