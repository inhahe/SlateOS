[package]
name = "xdg"
version = "0.1.0"
edition = "2024"
description = "SlateOS xdg-open/xdg-mime/mimeopen - file association tools"

# Built as `xdg-open` -- xdg-utils' `xdg-open`, the command this is when run by
# its own name -- not as `xdg`, which nobody types: the image installs each
# binary the workspace builds under the binary's name, and the names it also
# answers to (`xdg-mime` and `mimeopen`) as further names of the same file.
[[bin]]
name = "xdg-open"
path = "src/main.rs"

[dev-dependencies]
# `contents_before_rewrite`'s three outcomes each need a real file.
scratchdir = { path = "../scratchdir" }

[dependencies]
# Reading a file whose absence is normal but whose unreadability is not;
# see that crate's docs for the four programs that each wrote it wrong.
optionalfile = { path = "../../optionalfile" }
# One rendering of untrusted text inside a diagnostic. The file or URL
# xdg-open is handed, the MIME type looked up for it and the handler program
# it resolves to are all attacker-influenceable -- the MIME type is derived
# from the name, and a name may hold a newline. A message that pastes one in
# raw lets whoever named the file write extra lines of this program's
# output. See `userspace/quoting`.
quoting = { path = "../quoting" }
