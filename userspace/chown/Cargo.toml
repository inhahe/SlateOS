[package]
name = "chown"
version = "0.1.0"
edition = "2024"
description = "SlateOS file ownership and permission utility (chown/chmod)"

# `pwdb` for `/etc/passwd` and `/etc/group`, which is where a name becomes a
# number for every POSIX tool. This crate read `/etc/users.yaml` through
# `userdb` until `design-decisions.md` §353 made the flat files generated from
# it and therefore always in agreement -- at which point reading the database
# bought nothing and cost something: `chown` is unprivileged, and the database
# holds every password hash, so an unprivileged reader of it is the reason the
# file cannot be mode 0600. See `known-issues.md` ->
# `B-USERS-YAML-IS-WORLD-READABLE-AND-HOLDS-EVERY-PASSWORD-HASH`.
[dependencies]
# One rendering of untrusted text inside a diagnostic. chown/chgrp/chmod
# name a path in every message they print, and a path may hold any byte but
# `/` and NUL -- including a newline. So `chmod: cannot access {path}` lets
# whoever *named* the file write extra lines of this program's stderr. See
# `userspace/quoting`.
quoting = { path = "../quoting" }
pwdb = { path = "../pwdb" }

# The one mode-string grammar. See design-decisions.md 364.
modechange = { path = "../modechange" }

[dev-dependencies]
# One test generates `/etc/passwd` with the writer and reads it back with the
# reader, which is the only step at which the two can be seen to disagree.
userdb = { path = "../userdb" }
scratchdir = { path = "../scratchdir" }
