[package]
name = "minesweeper"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The app drew a board and answered clicks for its whole life without ever
# depending on the window system, so there was nothing for a user to click:
# `main` ran a scripted game and printed it. `oswindow` is what makes the
# difference between a simulation and a program.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
