[package]
name = "diskanalyzer"
version = "0.1.0"
edition = "2024"
description = "SlateOS Disk Usage Analyzer — treemap, file list and extension breakdown"
[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window and its event loop. Without this, `fn main` was empty: the treemap,
# the breadcrumbs, the sortable list and the extension chart existed only for
# the tests to call, and nothing in the program could be clicked.
oswindow = { path = "../../gui/window" }

# Test fixtures only: a private temp directory per test, removed on drop. The
# scanner reads a real filesystem, so its tests need a real one to read.
[dev-dependencies]
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
