[package]
name = "yuv"
version = "0.1.0"
edition = "2024"
description = "Pictures in YUV to RGB as libavif converts them -- libyuv's fixed point and libavif's floating point, ported -- and libyuv's plane scaling: what AVIF pictures and video frames are drawn with."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The HDR conversion's pow, exp and log (src/managed.rs) -- `core` has none, and
# the crate is no_std.
libm = "0.2"

[lints]
workspace = true
