[package]
name = "journalctl"
version = "0.1.0"
edition = "2024"
description = "SlateOS journalctl - journal log viewer and manager"
[dependencies]
# Diagnostics name journal file paths, and a path may hold spaces or
# newlines; scripts/quote-names.py enforces that they are quoted.
quoting = { path = "../quoting" }

[dev-dependencies]
# Log files for the reading tests: a bad byte, text lines, a torn append,
# truncation. Real files, because what is under test is how they are read.
scratchdir = { path = "../scratchdir" }
