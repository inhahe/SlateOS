[package]
name = "dots"
version = "0.1.0"
edition = "2024"

[dependencies]
# The toolkit's buttons at a game's size (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = DotsAndBoxes::new();` -- it
# built a board, dropped it and exited, and the lattice it would have drawn was
# sized from three constants that no window ever reached.
oswindow = { path = "../../gui/window" }
# `is_plain`: a key held with Alt or the Windows key is not the game's.
textline = { path = "../textline" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
