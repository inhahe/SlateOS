[package]
name = "lsns"
version = "0.1.0"
edition = "2024"
description = "SlateOS lsns utility"
[dependencies]
# `/proc/<pid>/comm` is read as BYTES here (`trim_comm` + `display_bytes`).
# `read_to_string` fails on a name that is not UTF-8, and that failure was
# landing on the same placeholder as a process that had exited. Zero
# dependencies of its own, so it is safe under 768.
procinfo = { path = "../../procinfo" }

# An option value that is not valid Unicode still has to appear in the
# diagnostic that refuses it, as the bytes the user typed. Pure formatting,
# no I/O of its own, so 768-exempt for the same reason `procinfo` is.
quoting = { path = "../quoting" }
