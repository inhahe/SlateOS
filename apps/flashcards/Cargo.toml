[package]
name = "flashcards"
version = "0.1.0"
edition = "2024"

[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The keys a one-line field answers, shared rather than copied.
textline = { path = "../textline" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it.
safeio = { path = "../safeio" }

# The zone rules, so "due today" is judged against the user's midnight
# rather than UTC's.
tzrules = { path = "../../tzrules" }

# Where the decks are kept: a directory of deck files under the user's
# settings (`settingsfile::config_dir`).
settingsfile = { path = "../../gui/settingsfile" }

# Two windows of Flashcards keep each other's cards and reviews: random ids,
# a merge by id, and a watch on the decks' folder (design-decisions §1239).
recordfile = { path = "../recordfile" }

# "Your latest changes are not saved", asked the way every editor here asks,
# when the window is closed while keeping a deck is failing.
unsaved = { path = "../unsaved" }

[dev-dependencies]
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }
# `refuse_replacing`, so a test can fail a save at the write with the deck
# still readable: a save reads the file first (design-decisions §1239).
safeio = { path = "../safeio", features = ["testing"] }

[lints]
workspace = true
