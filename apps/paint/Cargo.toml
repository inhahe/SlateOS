[package]
name = "paint"
version = "0.1.0"
edition = "2024"
description = "SlateOS Paint — drawing and image editing application"
[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# Whether a key is plain, a Ctrl chord, or Alt's or the Windows key's: the one
# statement of each, where this file had its own.
textline = { path = "../textline" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }
safeio = { path = "../safeio" }
# Opening a picture: every format the system decodes. Paint had a reader of
# its own for one kind of BMP and nothing else.
imagecodec = { path = "../../gui/imagecodec" }
# Saving one as a PNG, the default.
pngwrite = { path = "../pngwrite" }
# "Unsaved changes -- save them?", asked the way every editor here asks it.
unsaved = { path = "../unsaved" }
# The undo history: whole pictures, kept as the toolkit's tree, so an edit
# after undoing keeps what was undone (C-Q24, design-decisions §1416).
statehistory = { path = "../statehistory" }

# The same crate again with its `audit` counters on, so the tests can prove a
# save really went through `safeio` and did not quietly regress to
# `std::fs::write`. Cargo unifies this with the dependency above when building
# tests, so the counters cost nothing in the shipped binary.
[dev-dependencies]
safeio = { path = "../safeio", features = ["audit"] }
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
