[package]
name = "torrent"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
oswindow = { path = "../../gui/window" }

# Ctrl+O reads through `safeio::read_capped`, the byte-oriented one: a
# `.torrent` is bencode, and the text reader would refuse it at the first byte
# that is not UTF-8.
safeio = { path = "../safeio" }

[lints]
workspace = true
