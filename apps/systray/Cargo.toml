[package]
name = "systray"
version = "0.1.0"
edition = "2024"
description = "SlateOS System Tray — notification area and quick settings"
[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window and its event loop. Without this the tray was unreachable:
# `fn main` built a `SystemTray`, rendered one frame into a `let _`, and
# returned -- so `handle_click`, correct and carrying ten tests, was called by
# nothing but its own tests.
oswindow = { path = "../../gui/window" }
# The zone the clock is read through. UTC today, explicitly and greppably --
# see `set_time_from_utc`. Without a clock at all the tray showed a hardcoded
# 2026-05-17 14:30 for the life of the process, and `tick` never rolled the
# day over, so the calendar popup was permanently stuck on that May.
tzrules = { path = "../../tzrules" }

[lints]
workspace = true
