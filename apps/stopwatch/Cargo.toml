[package]
name = "stopwatch"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The window and its clock. Without it `main` built a StopwatchApp, dropped it
# and exited — a stopwatch with no face, no buttons, and nothing to tick it.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `appearance::palette_check`.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
