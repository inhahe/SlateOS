[package]
name = "ftpd"
version = "0.1.0"
edition = "2024"
description = "SlateOS ftpd - FTP server daemon"

# `authlib` for password authentication -- the one place SlateOS answers "is
# this the user's password?". ftpd previously answered it itself, with
# `lookup_user(username).is_some()`: the password argument was named
# `_password` and never read, so any password logged in any user listed in the
# world-readable /etc/passwd.
[dependencies]
authlib = { path = "../authlib" }

# Tests only: they build a real `$6$` shadow entry with the same hasher
# `passwd` uses, rather than pasting a constant that could drift away from it.
[dev-dependencies]
posix = { path = "../../posix" }
# And `scratchdir` for the per-test shadow files themselves. This is the suite
# where the clock-named fixture was first seen to fail: two tests landed on one
# `/etc/shadow` stand-in and one read back the other's line. See known-issues.md
# `B-FTPD-SSHD-AUTH-TESTS-SHARE-TEMP-FILES-AND-FLAKE`.
scratchdir = { path = "../scratchdir" }

# Inherit the workspace lint configuration. This crate carried only a bare
# `#![deny(clippy::all)]` in `main.rs`, so it had neither `pedantic` nor the four
# the workspace keeps at `warn` -- `unwrap_used`, `expect_used`,
# `indexing_slicing`, `arithmetic_side_effects` -- over code that parses
# attacker-supplied protocol commands and decides whether a password is correct.
[lints]
workspace = true
