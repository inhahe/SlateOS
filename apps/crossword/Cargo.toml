[package]
name = "crossword"
version = "0.1.0"
edition = "2024"

[dependencies]
# The toolkit's buttons at a game's size (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# Needed because `main` was `let _app = CrosswordApp::new();` -- the app built its
# whole state and dropped it, having never asked the compositor for a window.
oswindow = { path = "../../gui/window" }
# `is_plain` and `is_ctrl_chord`: a chord is not the puzzle's, and AltGr is not Ctrl.
textline = { path = "../textline" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
