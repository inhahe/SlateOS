[package]
name = "mixer"
version = "0.1.0"
edition = "2024"
description = "SlateOS Sound Mixer — per-app volume control"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` built a widget tree, dropped it, ticked the peak
# meters ten times, built the tree again and dropped that too — so no fader ever
# reached a screen and no click ever arrived. That is how a volume mixer could
# ship with no `Event::Mouse` arm anywhere in the file, and with a public
# `handle_slider_click` whose two arguments nothing in the program computed.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
