[package]
name = "yahtzee"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
randrange = { path = "../../randrange" }
# The window. Without it `main` was `let _app = Yahtzee::new();` -- it rolled
# a first hand into a struct and dropped it, so no die and no scorecard ever
# reached a screen and no click ever arrived.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
