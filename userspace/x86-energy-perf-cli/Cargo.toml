[package]
name = "x86-energy-perf-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# It interpolates `policy` into "x86_energy_perf_policy: setting policy to
# {}". That value is a path from the command line, and a path may hold any
# byte but `/` and NUL -- a newline included.
quoting = { path = "../quoting" }
