[package]
name = "undelete"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
oswindow = { path = "../../gui/window" }
# Whether a key is plain, a Ctrl chord or typing: a chord is not the
# window's, and AltGr types into the search.
textline = { path = "../textline" }

[lints]
workspace = true
