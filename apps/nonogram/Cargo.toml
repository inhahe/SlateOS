[package]
name = "nonogram"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = NonogramApp::new();` — it built
# the puzzle catalogue, computed every clue and dropped the lot, so no picture
# ever reached a screen and no key or click ever arrived.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
