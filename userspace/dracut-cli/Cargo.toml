[package]
name = "dracut-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# It interpolates `image` into "dracut: generating {} for kernel {}". That
# value is an argv word, so it is whatever the user typed and not text this
# program chose. It interpolates `version` into "dracut: generating {} for
# kernel {}". That value is an argv word, so it is whatever the user typed
# and not text this program chose. It interpolates `image` into "dracut:
# created {} (24.5 MB)". That value is an argv word, so it is whatever the
# user typed and not text this program chose.
quoting = { path = "../quoting" }
