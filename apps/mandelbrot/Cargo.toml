[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it the explorer computed one fractal, dropped it, and
# exited before anything reached a screen.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `appearance::palette_check`.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
