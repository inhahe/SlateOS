[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "SlateOS App Launcher — quick launch dialog with search"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window and its event loop. Without this the whole dialog was
# unreachable: `fn main` built a launcher, rendered one frame into a `let _`,
# and returned -- so `handle_key`, correct and well covered, was called by
# nothing but its own tests.
oswindow = { path = "../../gui/window" }

# The installed programs' desktop entries, read as the start menu reads them
# (C-Q17, design-decisions §1423): the launcher finds what is installed rather
# than keeping its own list of what might be.
desktopentry = { path = "../../gui/desktopentry" }
# SlateOS's own programs: the one list of them (C-Q20, design-decisions
# §1425), which the start menu reads too, instead of a copy of its own.
programs = { path = "../../gui/programs" }

[dev-dependencies]
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
