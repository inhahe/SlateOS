[package]
name = "qrcode"
version = "0.1.0"
edition = "2024"

[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The keys a one-line field answers, shared rather than copied.
textline = { path = "../textline" }
# The boxes' right-click menu -- Cut, Copy, Paste, Delete, Select all --
# held, routed and drawn as every program's is.
fieldmenu = { path = "../fieldmenu" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# A saved code is written through `safeio::write_str_atomically`, so a crash
# mid-save cannot leave half a picture where a whole one was.
safeio = { path = "../safeio" }

[lints]
workspace = true
