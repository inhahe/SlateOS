[package]
name = "fileassoc"
version = "0.1.0"
edition = "2024"
description = "SlateOS file association manager — which program opens which file type"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window and its event loop. Without this `fn main` was empty, and the
# consequence here was starker than usual: the toolbar, the sidebar, the table
# and the modal dialog were all drawn and *none* of them handled an event, so
# every control in the program was a picture of a control.
oswindow = { path = "../../gui/window" }

# Format-preserving YAML, and where the file lives. Associations are
# configuration, and design.txt says configuration is YAML "processed with a
# library that preserves comments and formatting" -- so they go through the two
# crates every other settings surface in this tree uses, rather than the
# hand-rolled `ext=app` codec this program used to carry.
yamldoc = { path = "../../yamldoc" }
settingsfile = { path = "../../gui/settingsfile" }

# Exporting writes a file the user chose, and a half-written export is a
# config that imports as garbage. Same atomic write the rest of the tree uses.
safeio = { path = "../safeio" }

[dev-dependencies]
# `settingsfile::testing::with_scratch_config`. Four tests here change an
# association, and changing one now writes the file -- so without this they
# would write the developer's own ~/.config/slateos, which is what
# scripts/check-scratch-config.py exists to refuse.
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }
# A directory to export into and import back out of.
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
