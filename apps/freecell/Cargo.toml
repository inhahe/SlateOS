[package]
name = "freecell"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome and the cards every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
# The undo history: the toolkit's tree, kept of whole games (C-Q24).
statehistory = { path = "../statehistory" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = FreeCell::new();` — it dealt
# fifty-two cards across eight columns and dropped the lot, so no card ever
# reached a screen and no key ever arrived.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
