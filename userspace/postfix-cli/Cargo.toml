[package]
name = "postfix-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# It interpolates `cmd` into "postfix: unknown command {}. Use:
# start|stop|reload|status|flush|check". That value is an argv word, so it
# is whatever the user typed and not text this program chose.
quoting = { path = "../quoting" }
