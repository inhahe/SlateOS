[package]
name = "sbctl"
version = "0.1.0"
edition = "2024"
description = "Secure Boot status, and the keys the kernel holds"

[lints]
workspace = true

[dependencies]
# Arguments are bytes; a name in a diagnostic is quoted.
quoting = { path = "../quoting" }
# close_stdout's checks, and diagnostics in util-linux's shape.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor sbctl was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
