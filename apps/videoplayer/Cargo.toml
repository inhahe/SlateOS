[package]
name = "videoplayer"
version = "0.1.0"
edition = "2024"

[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
oswindow = { path = "../../gui/window" }

# What a video file holds -- its container, length and tracks -- read from
# its headers, for the Media Info tab, the playlist and the track choices.
mediaprobe = { path = "../mediaprobe" }
# The pictures: lane F's video library, which demuxes a Matroska, WebM or MP4
# file, decodes its VP8, VP9 or AV1 and converts each picture to pixels
# (requests/f-e-two-matroska-demuxers-which-stays.md). The player keeps the
# timing and the display.
videocodec = { path = "../../gui/video/codec" }

# Where the settings are kept: `<config>/videoplayer.yaml`, one file per
# program (C-Q26, option A).
settingsfile = { path = "../../gui/settingsfile" }
yamldoc = { path = "../../yamldoc" }
# `is_plain` and `is_ctrl_chord`: a key held with the Windows key is not the
# player's, and AltGr is not Ctrl.
textline = { path = "../textline" }

[dev-dependencies]
# A scratch configuration directory, so no test writes the developer's own.
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
