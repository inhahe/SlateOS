[package]
name = "loginctl"
version = "0.1.0"
edition = "2024"
description = "SlateOS loginctl utility"
[dependencies]
# One rendering of untrusted text inside a diagnostic. Session ids, seat and
# device names and the user names this utility echoes back are argv words, and
# a command line may hold a newline -- so a message that pastes one in raw lets
# whoever wrote the argv write extra lines of this program's output. See
# `userspace/quoting`.
quoting = { path = "../quoting" }
