[package]
name = "lockfile"
version = "0.1.0"
edition = "2024"
description = "SlateOS lockfile - procmail 3.24's lockfile(1), ported: create semaphore files"

[lints]
workspace = true

[dependencies]
# The passwd lookups behind -ml, -mu and -v (procmail's auth_finduser and
# auth_finduid): the same reader whoami and id use.
pwdb = { path = "../pwdb" }
