[package]
name = "gzip"
version = "0.1.0"
edition = "2024"
description = "GNU gzip 1.12, ported: compress to .gz, and decompress gzip, pkzip, pack, compress and LZH files"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gzip"
path = "src/main.rs"

[dependencies]
# getopt_long, as glibc parses -- and words.
getoptlong = { path = "../getoptlong" }
# The C library: openat, unlinkat, futimens, fdopendir, signals, localtime.
libcall = { path = "../../libcall" }
# A name in a diagnostic, with its unprintable bytes escaped.
quoting = { path = "../quoting" }
# strerror's text, whatever the host.
errmsg = { path = "../errmsg" }
# The standard descriptors and SIGPIPE as the process was started with them:
# `gzip -c f >&-` must fail, and a closed pipe must kill it.
stdfdguard = { path = "../stdfdguard" }

[lints]
workspace = true
