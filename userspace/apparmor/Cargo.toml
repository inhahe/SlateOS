[package]
name = "apparmor"
version = "0.1.0"
edition = "2024"
[dependencies]
# One rendering of untrusted text inside a diagnostic. Profile names, the
# policy files this parser is pointed at and the binary paths `aa-genprof`
# writes profiles for are all argv words or text read out of a policy file --
# and both may hold a newline. A message that pastes one in raw lets whoever
# supplied it write extra lines of this program's output. See
# `userspace/quoting`.
quoting = { path = "../quoting" }
