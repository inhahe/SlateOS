[package]
name = "sfdisk"
version = "0.1.0"
edition = "2024"
description = "sfdisk, util-linux 2.39.3's, ported: display or manipulate a disk partition table from a script"

[lints]
workspace = true

[dependencies]
# The library: labels, partitions, dialogs, and the scripts sfdisk reads.
libfdisk = { path = "../libfdisk" }
# fdisk-list.c, which upstream links into both programs, and the shared
# standard output and input.
fdisk = { path = "../fdisk" }
# glibc's getopt_long: GNU order, abbreviations and their ambiguities.
getoptlong = { path = "../getoptlong" }
# argv is bytes; a device or file name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# lib/colors.c: the welcome, header, help-title and warning colours.
ulcolors = { path = "../ulcolors" }
# err_exclusive_options, the number parsers.
ulstrutils = { path = "../ulstrutils" }
# stdout buffered as glibc buffers it, and close_stdout at the end.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor sfdisk was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
# /proc/partitions' whole disks, canonical paths, paths from bytes.
ulsysfs = { path = "../ulsysfs" }
# blkdev_lock, blkdev_get_sectors.
ulblkid = { path = "../ulblkid" }
# strerror's wording for %m.
errmsg = { path = "../errmsg" }
# The terminal's width for the move progress line.
smartcols = { path = "../smartcols" }

[dev-dependencies]
scratchdir = { path = "../scratchdir" }
