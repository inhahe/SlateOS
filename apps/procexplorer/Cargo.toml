[package]
name = "procexplorer"
version = "0.1.0"
edition = "2024"
description = "SlateOS Process Explorer — graphical system monitor and task manager"
[dependencies]
# What it does to a process -- close, end without asking, force, pause,
# resume -- and the line it says about it, shared with `apps/sysmonitor`
# (design-decisions 1072).
processctl = { path = "../processctl" }
# The system those are asked of, `procstop::System::SINGLE`.
procstop = { path = "../../userspace/procstop" }
pathtext = { path = "../pathtext" }
# The keys that edit the New Task box's command line.
textline = { path = "../textline" }
# The right-click menu of the filter box and the New Task box's line -- Cut,
# Copy, Paste, Delete, Select all -- held, routed and drawn as every
# program's is.
fieldmenu = { path = "../fieldmenu" }
# An environment variable or a mapped file's name that is not text is shown
# by its bytes, as escapes -- the tree's one renderer for untrusted text.
quoting = { path = "../../userspace/quoting" }
# `kill(2)` is stateful and therefore reachable only through the C ABI,
# per design-decisions 768. `libcall` is that door.
libcall = { path = "../../libcall" }
# Real processes, not invented ones. The shared `/proc` reader, which exists
# because this lane asked for it -- see requests/c-b-the-proc-readers-in-
# userspace-sysinfo-should-be-a-crate-both-sysinfos-can-use.md.
procinfo = { path = "../../procinfo" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# A system that records what it is asked and does nothing.
procstop = { path = "../../userspace/procstop", features = ["fake"] }
# `appearance::palette_check`, the sweep that proves this crate draws from
# the user's palette rather than from colours of its own. Behind a feature
# because `cfg(test)` is set only when `appearance` itself is under test.
# Cargo unifies this with the ordinary dependency when building tests.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
