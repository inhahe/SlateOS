[package]
name = "backup-app"
version = "0.1.0"
edition = "2024"

[dependencies]
# The content-addressed blob store treats a file's presence at a hash-derived
# path as proof that the hash's content is there, so a blob must never appear
# at its final name until it is complete.
safeio = { path = "../safeio" }

[lints]
workspace = true
