[package]
name = "sliding"
version = "0.1.0"
edition = "2024"

[dependencies]
# The toolkit's buttons at a game's size, and the chrome's colours from the
# palette (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
randrange = { path = "../../randrange" }
# The window. Without it `main` built a `SlidingPuzzle`, dropped it and exited:
# no tile ever reached a screen, and no key or click ever arrived.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
