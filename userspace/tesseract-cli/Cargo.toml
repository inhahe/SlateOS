[package]
name = "tesseract-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# It interpolates `image` into "Processing {} (lang={}, psm={})". That value
# is a path from the command line, and a path may hold any byte but `/` and
# NUL -- a newline included. It interpolates `lang` into "Processing {}
# (lang={}, psm={})". That value is a path from the command line, and a path
# may hold any byte but `/` and NUL -- a newline included. It interpolates
# `psm` into "Processing {} (lang={}, psm={})". That value is a path from
# the command line, and a path may hold any byte but `/` and NUL -- a
# newline included.
quoting = { path = "../quoting" }
