# The third-party code gui/syntax carries (design-decisions 1433), read by
# scripts/gather-notices.py.
#
# The grammars are tree-sitter's, as their authors publish them: each one's
# generated parser.c is converted to Rust at build time (build.rs), and each
# one's scanner.c is ported by hand (src/grammars/). Both are substantial
# portions of the upstream grammar, so its MIT notice travels with them.
#
# tree-sitter-c2rust is the runtime, from crates.io. It ships no licence file
# of its own, so its notice is given here -- same name and version as
# Cargo.lock, which is how the gatherer matches the two. Its licence is
# tree-sitter's MIT licence; the transpiled runtime is tree-sitter's code.

# c2rust-bitfields is the runtime's own dependency: the C-compatible
# bitfields of the transpiled structs. It too ships no licence file; its
# Cargo.toml names BSD-3-Clause, and the text is the c2rust project's.
# (c2rust-bitfields-derive, the derive macro, runs in the compiler and is
# not in anything the image carries.)
c2rust-bitfields:
  version: 0.3.0
  licence: BSD-3-Clause
  texts:
    - c2rust-LICENSE

