[package]
name = "reminders"
version = "0.1.0"
edition = "2024"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it -- and the file being replaced is very
# often the only copy of the list.
safeio = { path = "../safeio" }

# The zone rules, so "overdue" is judged against the user's clock rather
# than a private copy of the calendar in this crate.
tzrules = { path = "../../tzrules" }

[lints]
workspace = true
