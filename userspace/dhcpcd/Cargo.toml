[package]
name = "dhcpcd"
version = "0.1.0"
edition = "2024"
description = "SlateOS dhcpcd - DHCP client daemon"
[dependencies]
# Interface names come from argv and lease fields come off the wire from the
# DHCP server.
quoting = { path = "../quoting" }
libcall = { path = "../../libcall" }
# The kernel's native error codes: SYS_NET_IF_CONFIG refuses with its own
# numbers (PermissionDenied is -400), not Linux's errno.
kerror = { path = "../kerror" }

[lints]
workspace = true
