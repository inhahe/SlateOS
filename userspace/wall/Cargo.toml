[package]
name = "wall"
version = "0.1.0"
edition = "2024"
description = "SlateOS wall/write/mesg terminal messaging"
[dependencies]
# It interpolates `other` into "mesg: invalid argument {} (use 'y' or 'n')".
# That value is an argv word, so it is whatever the user typed and not text
# this program chose.
quoting = { path = "../quoting" }
