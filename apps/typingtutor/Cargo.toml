[package]
name = "typingtutor"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = TypingTutorApp::new();` — it
# built the lesson list, dropped it and exited, so no lesson ever reached a
# screen and no keystroke was ever counted by the thing that counts keystrokes.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
