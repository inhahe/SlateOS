[package]
name = "snippets"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let app = App::new(); let _cmds =
# app.render();` — it built the library, drew one frame into a `Vec` nobody
# displayed and returned, so nothing ever reached a screen and no key or click
# ever arrived.
oswindow = { path = "../../gui/window" }

# Where the library is kept (the settings folder), the escapes its text is
# written with, and the atomic write -- as the notes library keeps its own.
safeio = { path = "../safeio" }
settingsfile = { path = "../../gui/settingsfile" }
textfmt = { path = "../../textfmt" }

# The editor's fields: one-line and the code itself.
textline = { path = "../textline" }
textarea = { path = "../textarea" }

# "Your latest changes are not saved", asked the way every editor here asks.
unsaved = { path = "../unsaved" }

[dev-dependencies]
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
