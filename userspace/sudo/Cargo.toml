[package]
name = "sudo"
version = "0.1.0"
edition = "2024"
description = "SlateOS sudo utility"

# `userdb` for `/etc/users.yaml`. This crate's `authenticate` ignored the
# password it was given and admitted anyone named anywhere in the file — and
# admitted *everyone* if the file was absent. See `design-decisions.md` §330.
#
# `authlib` for the shared failed-attempt tally. Guessing at this prompt was
# free and unlimited, which is worth more to an attacker here than anywhere
# else on the system: it is the prompt that grants root. See
# `design-decisions.md` §354.
[dependencies]
# Reading a file whose absence is normal but whose unreadability is not;
# see that crate's docs for the four programs that each wrote it wrong.
optionalfile = { path = "../../optionalfile" }
# sudo names the command, the target user and the host in the line it prints
# when it refuses. It is the privilege boundary, so a word an unprivileged
# caller chooses is reaching the most privileged output on the system -- and
# that line is also what gets logged.
quoting = { path = "../quoting" }
authlib = { path = "../authlib" }
# A sudoers rule's arguments are an fnmatch(3) pattern -- FNM_PATHNAME for
# sudoedit's -- or, between `^` and `$`, a POSIX extended regular expression,
# as upstream's `command_args_match` reads them; and a command pattern is
# matched with FNM_PATHNAME, so `*` never crosses a `/`.
fnmatch = { path = "../fnmatch" }
ere = { path = "../ere" }
# strerror(3)'s wording for an io::Error, as sudoedit's warnings give it.
errmsg = { path = "../errmsg" }
userdb = { path = "../userdb" }

# The faillock-sharing test needs a real file that two authenticators can both
# open. `scratchdir` gives it one that is unique per process *and* per thread,
# and that is removed on an unwind — which a `remove_dir_all` in the test's own
# tail structurally cannot do, since the tail is reached only when the test
# passed, and a passing test is the one with nothing worth leaving behind.
[dev-dependencies]
scratchdir = { path = "../scratchdir" }
# Test-only, never linked into the program: sudoedit's open flags and errno
# are held to the values SlateOS's C library gives them.
posix = { path = "../../posix" }

# The defensive lint set from `CLAUDE.md`. The crate that grants root is the
# last one that should panic on an argument someone chose.
[lints]
workspace = true
