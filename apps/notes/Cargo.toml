[package]
name = "notes"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically` rather than `fs::write`.
# `fs::write` truncates the target before writing it, so a save interrupted
# part-way leaves the note on disk as a fragment or as nothing -- and once a
# note has been exported, that file may be the user's only copy. Same reasoning
# as `apps/editor`, which is where this pattern comes from.
safeio = { path = "../safeio" }

[lints]
workspace = true
