[package]
name = "tetris"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it the game simulated a board for nobody: `main` built a
# `TetrisApp` and dropped it, so gravity never ran and no key ever arrived.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
