# rav1d, the AV1 decoder, vendored: see VENDORED.md for where it came from
# and what was changed.
#
# Upstream's own lint configuration (`#![allow(clippy::all)]` and its
# `deny`s in lib.rs) governs this crate, not the workspace's: it is somebody
# else's code, kept as close to theirs as possible so that updating it stays
# a diff against upstream rather than a rewrite. The safe interface this
# project added (`safe.rs`) is the part that is ours, and is small.
[package]
name = "rav1d"
version = "1.1.0"
edition = "2021"
rust-version = "1.79"
authors = ["Rav1d Developers", "Prossimo"]
description = "Rust port of the dav1d AV1 decoder, vendored into SlateOS"
license = "BSD-2-Clause"
repository = "https://github.com/memorysafety/rav1d"
readme = "README.md"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "lib.rs"

[features]
default = ["bitdepth_8", "bitdepth_16"]
bitdepth_8 = []
bitdepth_16 = []
# Upstream's assembly features, declared so that the code they gate compiles
# out without a warning. The assembly itself is not vendored: enabling any of
# these fails the build, by design.
asm = []
asm_arm64_dotprod = ["asm"]
asm_arm64_i8mm = ["asm"]
asm_arm64_sve2 = ["asm"]

[dependencies]
assert_matches = "1.5.0"
atomig = { version = "0.4.0", features = ["derive"] }
bitflags = "2.4.0"
cfg-if = "1.0.0"
libc = "0.2"
parking_lot = "0.12.2"
paste = "1.0.14"
raw-cpuid = "11.0.1"
strum = { version = "0.26", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.7.32", features = ["derive"] }
