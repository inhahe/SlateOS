[package]
name = "explorer"
version = "0.1.0"
edition = "2024"
description = "SlateOS File Explorer — graphical file manager with tree view"
[dependencies]
# Names are shown through `pathtext`: a byte that is not text, or a control
# character, as an escape -- never as a lossy decode.
pathtext = { path = "../pathtext" }

# Which program opens which kind of file. This crate is the one that *obeys*
# the associations, so it reads them through the shared model rather than
# spelling the group name and key path itself. See gui/associations/src/lib.rs.
associations = { path = "../../gui/associations" }
# The programs SlateOS knows, what each opens and what opens a type before a
# person chooses (C-Q20, design-decisions §1425): opening a file nobody chose
# a program for, and Open With.
programs = { path = "../../gui/programs" }
# The installed programs' desktop entries, read as the start menu reads them,
# and the command line an entry starts its program with on a file.
desktopentry = { path = "../../gui/desktopentry" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# Where the user's file associations live. Only `config::load` is used -- the
# explorer reads which program opens a kind of file and never writes it, since
# that choice belongs to the File Associations program.
settingsfile = { path = "../../gui/settingsfile" }
# `is_plain`, `is_ctrl_chord`, `is_alt_or_windows_chord`: a chord is neither the file list's key nor typed into the path.
textline = { path = "../textline" }
yamldoc = { path = "../../yamldoc" }
textfind = { path = "../../textfind" }
# The thumbnailer reads BMP, PNG, GIF and JPEG headers at offsets the file
# itself supplies. `byteread` is those reads stating their own bound.
byteread = { path = "../../byteread" }

# The picture decoder. Without it a `.png` in the icon view thumbnailed as a
# flat green rectangle of the right aspect ratio and nothing more -- the code
# said so: "we produce a placeholder ... since we lack a full decoder in this
# crate". Only uncompressed BMP got a real thumbnail, which is the one format
# nobody's photographs are in. See known-issues.md
# TD-C-NOTHING-DECODES-A-PICTURE-SO-EVERY-IMAGE-ID-NAMES-NOTHING.
imagecodec = { path = "../../gui/imagecodec" }

# A photograph's EXIF, for the Camera, Date Taken and Orientation columns.
exif = { path = "../exif" }

# A zip archive's own directory, for the archive columns: how many files it
# holds and what they take up. Read from the end of the file through
# `ziparchive::parse_at`, without reading the rest.
ziparchive = { path = "../../ziparchive" }

# A TAR's own headers, for the archive columns: what it holds and what
# that takes up, read a header at a time.
tararchive = { path = "../tararchive" }

# An audio file's length, bitrate, sample rate and tags, for the audio
# columns -- the readers the music player uses, from its headers and tags
# without decoding a sample.
audiotags = { path = "../audiotags" }

# A video's length, picture size and frame rate, for the video columns --
# read from its headers; nothing here decodes a frame.
mediaprobe = { path = "../mediaprobe" }

# The window, the event loop, and the hook that gets thumbnail pixels to the
# compositor. Without it `main` was a scripted print-only demo: the explorer
# could lay out a frame but had nowhere to put it and no way to be clicked.
oswindow = { path = "../../gui/window" }

# Was `mod thumbs` in this binary until the photo library needed the same
# machinery. The call sites did not move: `use thumbs::{...}` resolves to the
# crate exactly as it resolved to the module.
thumbs = { path = "../../gui/thumbs" }
# Thumbnails are made off the window's thread and handed back through the
# waker the window gives it, so a folder of photographs never stalls the
# window.
offloop = { path = "../offloop" }
# The recycle bin, shared with the image viewer's Delete so both use one bin.
recyclebin = { path = "../recyclebin" }

[dev-dependencies]
# `exif::testing`: a camera's EXIF, for the EXIF columns' tests.
exif = { path = "../exif", features = ["testing"] }
# Gzipped fixtures for the archive columns' tests.
deflate = { path = "../../deflate" }
# Test fixtures only: a private temp directory per test, removed on drop.
scratchdir = { path = "../../userspace/scratchdir" }

# `with_scratch_config`: opening a file reads the user's associations, so the
# tests for it must read a throwaway directory rather than the developer's own.
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

# `appearance::palette_check`, the sweep that proves this crate draws from the
# user's palette rather than from colours of its own.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
