[package]
name = "dbviewer"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The database browser had no way in. `main` built a sample database, drew one
# frame into a `Vec` and dropped it, so every control below -- Execute, the
# database tabs and their close boxes, the object tree, the column headers that
# sort, the pagination arrows, the four bottom-panel tabs, the query history --
# was a painted rectangle that answered nothing. `oswindow` is the door.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
