[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
description = "SlateOS desktop shell — window manager, taskbar, system tray"

# A library first, and a binary only incidentally. The shell's surfaces —
# taskbar, decorations, Alt-Tab, start menu, calendar — all produce a
# `RenderTree` for something else to paint, and while this crate was a bare
# binary there was nothing outside it that *could*: `DesktopShell` was not
# importable at any price, so five public render methods had exactly one caller
# each, the crate's own demo. See known-issues.md
# TD-C-THE-SHELL-CAN-DRAW-ITSELF-AND-NOBODY-CAN-ASK-IT-TO.
[lib]
name = "desktop"
path = "src/lib.rs"

# The scripted demonstration. Kept because a library whose only caller is its
# own test suite is one refactor away from drifting from what a real session
# does; this is a second caller that goes through the public API.
[[bin]]
name = "desktop"
path = "src/main.rs"

[dependencies]
guitk = { path = "../toolkit" }

# The compositor protocol's vocabulary — `WindowInfo`, the shape of the window
# list a taskbar is built from, and `ShellControlAction`, the shape of what a
# taskbar button asks for. The *transport* is deliberately not here: this crate
# produces render trees and intents, and the loop that carries them belongs to
# whatever runs the shell. Depending on the words without depending on the wire
# is what keeps `DesktopShell` drivable in a test with no compositor at all.
#
# It costs nothing extra to pull in: `guiremote`'s only dependency is `guitk`,
# which this crate already has.
guiremote = { path = "../remote" }

# The client side of that protocol — a connection, windows, an event loop.
# `session::ShellSession` is built on it: the shell's three surfaces are
# ordinary compositor windows, and the taskbar's intents go out as ordinary
# requests. Depending on it does not make the rest of the crate need a
# compositor — `DesktopShell` still renders and hit-tests with no connection at
# all, which is what keeps every test in here offline.
oswindow = { path = "../window" }

# The POSIX `TZ`-rule engine, shared with the libc (`posix`) and the shell
# (`userspace/oils`). The taskbar clock is the most-looked-at rendering of local
# time on the machine, so if it carried its own notion of a zone it would be the
# most visible thing on the desktop to disagree with `date`. See
# tzrules/src/lib.rs's "Why this is a crate and not a module".
tzrules = { path = "../../tzrules" }

# Format-preserving YAML, for settings that are written back to disk.
# design.txt requires configuration to be "processed with a library that
# preserves comments and formatting": a user who annotates their config file
# and then changes a setting in the UI has to get their annotations back.
# See yamldoc/src/lib.rs.
yamldoc = { path = "../../yamldoc" }

# The appearance settings model, shared with the Settings application so the
# two processes cannot disagree about what the user chose. The shell paints
# from it (DesktopTheme::from_settings) and hosts the panel that edits it.
appearance = { path = "../appearance" }

# The input settings model, on the same terms as `appearance` above: the
# compositor applies these values, the Settings application edits them, and the
# panel in `mouse_settings` renders them, so none of the three can own them.
inputsettings = { path = "../inputsettings" }

# The picture decoder. `WallpaperManager` names an image id and the compositor
# draws whatever bytes are stored under it — but nothing was ever putting bytes
# there, so a wallpaper set to a `.png` painted the colour underlay and nothing
# else. `session::ShellSession` reads the file and uploads it; the manager
# itself stays free of I/O, which is what keeps its two thousand lines of tests
# runnable with no filesystem. A leaf crate with no dependencies of its own.
# See known-issues.md TD-C-NOTHING-DECODES-A-PICTURE-SO-EVERY-IMAGE-ID-NAMES-NOTHING.
imagecodec = { path = "../imagecodec" }

# The keyboard layouts, shared with the compositor. The tray indicator and the
# layout preview in `input_method` are a *picture* of a keyboard, and the
# compositor is what the keyboard actually types through; when each of them
# carried its own table the picture could show a board nobody could type on.
# A leaf crate with no dependencies of its own, so reading it costs the shell
# nothing and does not drag a display server in behind it.
keylayout = { path = "../keylayout" }

# Which accounts the login screen offers, and whether each needs a password.
# Shared with `apps/lockscreen` rather than written out at both: two answers to
# "which names is the person standing at this machine offered" would drift
# silently, and the person cannot tell a hidden account from a deleted one.
loginusers = { path = "../loginusers" }

# The one place SlateOS answers "is this the user's password?". The session
# holds an `Authenticator` across attempts rather than building one per guess:
# a rate limit rebuilt for every guess is not a rate limit. It reads the same
# store `loginusers` enumerates, which is what stops the shell offering a name
# nothing can answer for.
authlib = { path = "../../userspace/authlib" }

[lints]
workspace = true

# `settingsfile::testing` -- reached here as `appearance::config::testing` --
# for the test that a save made by another process reaches a *running* shell.
# It needs a scratch configuration directory so it can exercise the real
# `store`/`Watcher` pair without touching the developer's own
# `~/.config/slateos`.
[dev-dependencies]
# `appearance::palette_check`, the sweep that proves a module draws from the
# palette rather than from colours of its own. Cargo unifies this with the
# ordinary dependency when building tests.
appearance = { path = "../appearance", features = ["testing"] }
# Test-only. The account-list tests write a `users.yaml` and read it back
# through the offer filter, so two tests naming one file would each assert
# against the other's data.
scratchdir = { path = "../../userspace/scratchdir" }
# Test-only. The end-to-end "the right password unlocks the desktop" test needs
# a stored entry, and it computes one with the same hasher `authlib` will
# recompute it with rather than pasting a literal -- a pasted `$6$` string is a
# test that keeps passing after the hasher it was copied from has changed.
posix = { path = "../../posix" }

settingsfile = { path = "../settingsfile", features = ["testing"] }
