[package]
name = "guitk"
version = "0.1.0"
edition = "2024"
description = "SlateOS GUI toolkit — widget library with Flexbox/Grid layout engine"

[dependencies]
osfont = { path = "../font" }
textfmt = { path = "../../textfmt" }
textfind = { path = "../../textfind" }

# The shared TZ-rules engine, for the file dialog's Modified column. The libc's
# `localtime`, the shell's `%(…)T` and the taskbar clock all render local time
# through this crate; a file dialog with its own calendar arithmetic would be a
# fourth answer to "what day is this timestamp?", and the one the user compares
# against `ls -l`. It is `no_std` and dependency-free, so linking it costs
# nothing. See tzrules/src/lib.rs's "Why this is a crate and not a module".
tzrules = { path = "../../tzrules" }

# The shared random-number source, re-exported as `guitk::rng`. It used to be a
# module here, but the entropy source it carries is needed by headless
# components too — the credential service, which cannot reasonably depend on a
# GUI toolkit — so it moved into the `no_std`, dependency-free crate the games
# were already using. See randrange/src/lib.rs's "This crate was itself
# duplicated".
randrange = { path = "../../randrange" }

[features]
# Turns on `osfont`'s per-pass timing so that `text::shaping_cost`'s phase
# breakdown has something to report. Off by default: it charges two clock
# reads to every pass of every shaping in the process, which is precisely what
# one does not want under the instrument's other tests. See
# gui/font/src/phase.rs.
phase-timing = ["osfont/phase-timing"]

[lints]
workspace = true
