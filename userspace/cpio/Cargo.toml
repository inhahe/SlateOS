[package]
name = "cpio"
version = "0.1.0"
edition = "2024"
description = "SlateOS cpio archive utility"
[dependencies]
# Diagnostics name files, and a file name reaches stderr with whatever
# bytes it holds -- a newline in one forges a log line. See
# `userspace/quoting`.
quoting = { path = "../quoting" }
# One definition of a mode word's file-type field, shared with `chmod`, `stat`
# and `ls -l`. An archive header stores the same integer they read.
modechange = { path = "../modechange" }
