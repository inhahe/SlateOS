[package]
name = "hearts"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# Needed because `main` was `let _app = Hearts::new();` -- the game dealt itself
# a hand and dropped it, having never asked the compositor for a window.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[lints]
workspace = true
