# Workspace-wide clippy configuration.
#
# `doc-valid-idents` extends (via the `..` entry, which splices in clippy's
# own default list) the set of identifiers that `clippy::doc_markdown` will
# not demand backticks around. Without it, every doc comment that names this
# project or a piece of prior art it cites — "SlateOS", "HarfBuzz",
# "DejaVu" — is reported as a missing-backticks warning, and the only ways
# to silence it are to backtick a proper noun in running prose (which reads
# as though it were a code identifier) or to sprinkle `#[allow]`s. Neither
# is right: these are words, not items.
#
# Keep this list to genuine proper nouns that appear in prose. Anything that
# really is a type, function or file name should be backticked instead.
doc-valid-idents = [
    "SlateOS",
    "HarfBuzz",
    "FreeType",
    "DejaVu",
    "OpenType",
    "TrueType",
    "PostScript",
    "OpenGL",
    "..",
]

# `arithmetic_side_effects` exists to catch integer arithmetic that can panic
# or wrap, and it already exempts `f32`/`f64` because IEEE arithmetic does
# neither: an out-of-range result is an infinity, an invalid one a NaN.
# `ExtF80` (coreutils' software x87 80-bit float, `userspace/coreutils/src/
# extfloat.rs`) is the same IEEE arithmetic done in software, so every `a + b`
# on one was being flagged for a hazard the operation does not have. The
# integer arithmetic *inside* `extfloat.rs`, where a real overflow could live,
# stays under the lint. Two names, because clippy matches the type's printed
# path: `extfloat::ExtF80` in the crate that defines it,
# `coreutils::extfloat::ExtF80` in the binaries that use it.
arithmetic-side-effects-allowed = ["coreutils::extfloat::ExtF80", "extfloat::ExtF80"]
