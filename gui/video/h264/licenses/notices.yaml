# The third-party code gui/video/h264 carries, read by
# scripts/gather-notices.py: one entry per upstream project, with the texts
# that must travel with any binary built from the crate.

# The decoder is FFmpeg's H.264 decoder translated into Rust, module by
# module, from FFmpeg 8.1.3's libavcodec, as src/lib.rs lists -- among them
# h274.c's film grain synthesis (src/h274.rs), whose tables FFmpeg took from
# SMPTE RDD 5-2006. Its bit reader and VLC tables (get_bits.h, golomb.h,
# vlc.c) are gui/video/ffbits', which carries its own notice. FFmpeg is LGPL
# version 2.1 or later; the translation is too (design-decisions/1376: the
# operator chose to translate FFmpeg's decoder, F-Q8).
FFmpeg:
  version: n8.1.3
  licence: LGPL-2.1-or-later
  texts:
    - FFmpeg-COPYING.LGPLv2.1
