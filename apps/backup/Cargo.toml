[package]
name = "backup-app"
version = "0.1.0"
edition = "2024"

[dependencies]
pathtext = { path = "../pathtext" }
# A name that is not text is shown by its bytes, as escapes -- the tree's one
# renderer for an untrusted name -- never as a lossy decode.
quoting = { path = "../../userspace/quoting" }

# The store: blobs, manifests, capture and restore. This program's engine
# until 2026-09-27, moved so that System Restore keeps its copies in the same
# store with the same guarantees.
snapstore = { path = "../snapstore" }
# The schedule file is rewritten whole, so a truncated write would lose every
# schedule, not only the one being added.
safeio = { path = "../safeio" }

# Byte sizes for the listings this tool prints. It is a command-line program and
# must not link a widget library, so it reaches the shared formatter through the
# dependency-free crate rather than through `guitk` -- the same layering the
# `tzrules` date request argues for, and the reason `textfmt` exists at all.
textfmt = { path = "../../textfmt" }

# The calendar arithmetic behind the timestamps this tool prints. Same layering
# argument as `textfmt` above: `tzrules` is `no_std` and dependency-free, so a
# command-line archiver can take the date algorithm without linking a widget
# library. This file carried the last local transcription of Hinnant's
# `civil_from_days` in the tree until `tzrules` exported it.
tzrules = { path = "../../tzrules" }

# Where the schedules are kept: the user's settings folder, which is what
# lets `backup run-due` find every one (C-Q21). `settingsfile` depends on
# nothing but `yamldoc`, so this links no widget library.
settingsfile = { path = "../../gui/settingsfile" }

# The same crate again with its `audit` counters on, so the tests can prove the
# schedule file's writes really go through `safeio` and did not quietly regress
# to `std::fs::write`. Cargo unifies this with the dependency above when
# building tests, so the counters cost nothing in the shipped binary.
[dev-dependencies]
safeio = { path = "../safeio", features = ["audit"] }
scratchdir = { path = "../../userspace/scratchdir" }
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
