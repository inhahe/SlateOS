[package]
name = "appearance"
version = "0.1.0"
edition = "2024"
description = "SlateOS appearance settings — the shared model behind the desktop's look"

[dependencies]
# For `Color`. Both consumers (the shell and the Settings app) already depend
# on the toolkit, so this adds no weight; the alternative — a local colour type
# converted at every boundary — would put a second definition of a colour in
# the one crate whose job is to stop there being two definitions of anything.
guitk = { path = "../toolkit" }

# Format-preserving YAML. A settings file a user has commented has to come back
# with the comments intact. See yamldoc/src/lib.rs.
yamldoc = { path = "../../yamldoc" }

# Where settings files live and how they are replaced atomically. Re-exported
# as `appearance::config`, which is what it used to be called; it moved out so
# that `inputsettings` could use it without depending on the appearance model
# (and through it on the toolkit). See gui/settingsfile/src/lib.rs.
settingsfile = { path = "../settingsfile" }

[features]
# Compiles `appearance::palette_check`, the sweep that proves a module draws
# from the palette rather than from colours of its own. A dependent turns it on
# in its own `[dev-dependencies]`, so the helper exists for `cargo test` and
# nowhere else. It cannot be `#[cfg(test)]`: that is only set when *this* crate
# is under test, not when a dependent is.
testing = []

[lints]
workspace = true
