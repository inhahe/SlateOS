[package]
name = "osfont"
version = "0.1.0"
edition = "2024"
description = "SlateOS Font Library — bitmap and outline font rendering"
[lib]
name = "osfont"
path = "src/lib.rs"

[features]
# Times each pass of `ScaledFont::shape_with` into a thread-local total, read
# back through the `phase` module. Off by default and never on in a shipped
# build: it is the only thing in this crate that reaches for `std::time`, which
# the `no_std` intent recorded in `lib.rs` does not allow, and it charges two
# `Instant::now()` calls to every pass it measures. See `src/phase.rs`.
phase-timing = []
# `osfont::testing`: complete font files built byte by byte -- a face with a
# colour glyph, say -- for the tests of crates that draw text. For
# `[dev-dependencies]` only; nothing in a shipped build asks for it.
testing = []

[[example]]
# Prints both normalizations of a variable font's instances for
# `tools/var_oracle.py`; the FreeType one is reached through `testing`.
name = "var_dump"
required-features = ["testing"]

[[example]]
# Prints outlines and extents at instances for `tools/outline_oracle.py`; the
# extents are reached through `testing`.
name = "outline_dump"
required-features = ["testing"]

[[example]]
# Times `wrap` against the word-by-word rule it replaced, reached through
# `testing`.
name = "wrap_time"
required-features = ["testing"]

[dependencies]
# The PNG decoder for colour bitmap glyphs (`bitmap.rs`: `CBDT` and `sbix`
# store each emoji as a picture). `no_std` + `alloc` like this crate means to
# be, and lane F's like this crate, so one decoder serves both. Without its
# default `avif` feature, which would bring an AV1 decoder (and `std`) for
# nothing a font stores.
imagecodec = { path = "../imagecodec", default-features = false }

[dev-dependencies]
# This crate itself with `testing`: the integration tests (`tests/`) link the
# library as any other crate would, without `cfg(test)`, and
# `tests/host_fonts.rs` checks the wrapping it ships against
# `osfont::testing::wrap_by_words`, the slow rule it replaced.
osfont = { path = ".", features = ["testing"] }

[lints]
workspace = true
