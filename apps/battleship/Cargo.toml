[package]
name = "battleship"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = BattleshipApp::new();` — it
# placed the AI's five ships and dropped the lot, so no grid ever reached a
# screen and no key ever arrived.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[lints]
workspace = true
