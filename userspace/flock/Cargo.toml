[package]
name = "flock"
version = "0.1.0"
edition = "2024"
description = "SlateOS flock - a port of util-linux's flock(1), managing file locks from shell scripts"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long, with upstream's two aliased long options.
getoptlong = { path = "../getoptlong" }
# util-linux's strtos32_or_err and strtotimeval_or_err, and their refusals.
ulstrutils = { path = "../ulstrutils" }
# Names in diagnostics with their unprintable bytes escaped (§370).
quoting = { path = "../quoting" }
# util-linux's close_stdout: stdout buffered as glibc buffers it (--verbose's
# lines follow the command's output), and a lost diagnostic counted.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor the process was started without stays closed, for
# flock and for the command it runs, rather than the runtime's /dev/null.
stdfdguard = { path = "../stdfdguard" }
