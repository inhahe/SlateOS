[package]
name = "filesearch"
version = "0.1.0"
edition = "2024"

# `globmatch` because a search tool should not hold a private opinion about
# what `[a-z]` means: this crate and `apps/indexer` each had their own matcher
# and their own bugs, and both are user-facing.
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
globmatch = { path = "../../gui/globmatch" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Opening a result: the program the user associated with its kind, read the
# way the file manager reads it, so a file opens with the same program from
# either. See gui/associations/src/lib.rs.
associations = { path = "../../gui/associations" }
# Where the associations live, and where saved searches are kept.
settingsfile = { path = "../../gui/settingsfile" }
yamldoc = { path = "../../yamldoc" }

# `with_scratch_config`, so the saved-search tests write a scratch settings
# directory and never the user's.
[dev-dependencies]
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
