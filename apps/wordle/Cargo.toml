[package]
name = "wordle"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = Wordle::new();` — it drew a
# seeded word from the system, built a grid and an on-screen keyboard, and
# dropped the lot, so no puzzle ever reached a screen and no key ever arrived.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
