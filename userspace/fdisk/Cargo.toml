[package]
name = "fdisk"
version = "0.1.0"
edition = "2024"
description = "fdisk, util-linux 2.39.3's, ported: display or manipulate a disk partition table; and fdisk-list.c, which sfdisk shares"

[lints]
workspace = true

[dependencies]
# The library every command works through: labels, partitions, dialogs, scripts.
libfdisk = { path = "../libfdisk" }
# glibc's getopt_long: GNU order, abbreviations and their ambiguities.
getoptlong = { path = "../getoptlong" }
# argv is bytes; a device or file name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# libsmartcols: the partition and free-space tables, mbsalign, the terminal.
smartcols = { path = "../smartcols" }
# lib/colors.c: the welcome, header, help-title and warning colours.
ulcolors = { path = "../ulcolors" }
# size_to_human_string, string_add_to_idarray, the number parsers.
ulstrutils = { path = "../ulstrutils" }
# stdout buffered as glibc buffers it, and close_stdout at the end.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor fdisk was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
# /proc/partitions' whole disks, canonical paths.
ulsysfs = { path = "../ulsysfs" }
# blkdev_lock, blkdev_get_sectors, the CD-ROM test.
ulblkid = { path = "../ulblkid" }
# strerror's wording for %m.
errmsg = { path = "../errmsg" }
# poll and sigaction, for a reply ^C cancels.
libcall = { path = "../../libcall" }
