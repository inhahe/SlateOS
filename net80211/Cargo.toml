[package]
name = "net80211"
version = "0.1.0"
edition = "2024"
description = "Shared no_std IEEE 802.11 MAC frame parsers and builders for SlateOS WiFi (wireless driver + supplicant)."

[lib]
path = "src/lib.rs"

# Dependency-free apart from `crc32`, and `no_std`, mirroring `netproto`: this
# crate is the single source of truth for 802.11 wire formats and is linked
# into the kernel-side wireless driver (x86_64-slateos), the userspace
# supplicant, and any bare-metal service that has to look at a WiFi frame. It
# must never pull in `std` or an allocator.
#
# `crc32` rather than a private copy of the polynomial: the 802.11 FCS *is* the
# IEEE 802.3 CRC-32, and that crate exists precisely because this checksum had
# already been re-implemented four separate times in this tree. Adding a fifth
# copy here would recreate the bug it was factored out to stop.
#
# `hmac` and `aes` are here for clause 12 (`kdf`). Key derivation is part of
# the wire format in the sense that matters: both ends must compute the same
# bytes or the handshake silently fails, so the derivation belongs beside the
# frames it authenticates rather than in whichever consumer got there first.
# Both are `no_std` and allocation-free, so they do not compromise the
# bare-metal linkability that the rest of this comment is about.
[dependencies]
aes = { path = "../aes" }
crc32 = { path = "../crc32" }
hmac = { path = "../hmac" }

[lints]
workspace = true
