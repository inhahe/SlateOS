[package]
name = "startupmanager"
version = "0.1.0"
edition = "2024"
description = "SlateOS Startup Apps Manager — which programs launch at boot"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window and its event loop. Without this `fn main` was empty, which here
# meant the toolbar, the sortable table, the search box and both dialogs were
# drawn and not one of them handled a click: a program made entirely of
# pictures of controls.
oswindow = { path = "../../gui/window" }
# Whether a key is plain, a Ctrl chord or typing: a key held with Alt or the
# Windows key is not the manager's, and AltGr types.
textline = { path = "../textline" }

[lints]
workspace = true
