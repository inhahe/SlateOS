[package]
name = "globmatch"
version = "0.1.0"
edition = "2024"
description = "SlateOS shared glob matcher — POSIX fnmatch semantics (`*`, `?`, bracket expressions) over characters, with the bash-compatible `^` negation. One implementation, so that two search tools in the same desktop cannot disagree about what a pattern means."

