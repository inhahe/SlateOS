[package]
name = "calendar"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it this program renders five views into a vector of draw
# commands, counts them, and exits before anybody can click a day.
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it.
safeio = { path = "../safeio" }

# Where the events are kept (the settings folder), and the escapes their text
# is written with -- as the notes library and the address book keep theirs.
settingsfile = { path = "../../gui/settingsfile" }
textfmt = { path = "../../textfmt" }

# The keys a one-line field answers, for the event form.
textline = { path = "../textline" }

# "Your latest changes are not saved", asked the way every editor here asks.
unsaved = { path = "../unsaved" }

[dev-dependencies]
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
