[package]
name = "losetup"
version = "0.1.0"
edition = "2024"
description = "losetup, util-linux 2.39.3's, ported: set up and control loop devices"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long: GNU order, abbreviations and their ambiguities.
getoptlong = { path = "../getoptlong" }
# argv is bytes; a device or file name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# libsmartcols: the --list table.
smartcols = { path = "../smartcols" }
# strtosize_or_err, err_exclusive_options, string_add_to_idarray.
ulstrutils = { path = "../ulstrutils" }
# stdout buffered as glibc buffers it, and close_stdout at the end.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor losetup was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
# lib/loopdev.c: the loop devices themselves; lib/canonicalize.c.
ulsysfs = { path = "../ulsysfs" }
# access(2), for whether /dev/loop-control may be written.
libcall = { path = "../../libcall" }

[build-dependencies]
embed-manifest = "1.5.0"
