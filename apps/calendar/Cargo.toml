[package]
name = "calendar"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it this program renders five views into a vector of draw
# commands, counts them, and exits before anybody can click a day.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
