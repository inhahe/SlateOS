[package]
name = "telnet"
version = "0.1.0"
edition = "2024"
description = "SlateOS telnet client"
[dependencies]
# Host names come from argv and option and banner text comes off the
# connection.
quoting = { path = "../quoting" }
# The terminal through the C library: keys read raw on standard input
# (tcgetattr, tcsetattr, read), what it draws written to standard output.
libcall = { path = "../../libcall" }

[lints]
workspace = true
