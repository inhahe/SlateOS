[package]
name = "zip"
version = "0.1.0"
edition = "2024"
description = "SlateOS zip/unzip archive utility"
[dependencies]
# zip names the directory it is skipping and unzip names the destination it
# extracted into; both are paths, and the second was passed to -d.
quoting = { path = "../quoting" }

# The ZIP checksum. This is the *reflected IEEE* CRC-32 (polynomial
# 0xEDB88320) that PKZIP and gzip specify — not the CRC32C (Castagnoli) the
# kernel uses for ext4 metadata. Both are called "CRC-32" in conversation and
# they produce entirely different values, so the distinction is worth stating
# here rather than leaving it to be rediscovered from a checksum that
# verifies against nothing.
crc32 = { path = "../../crc32" }

# DEFLATE (method 8), the only compressed method ZIP entries use here.
# `inflate_limited` is the reason this is a dependency rather than a local
# decoder: it takes the output ceiling as a parameter, so an entry that
# expands past the size the central directory declares is refused at that
# byte instead of after the expansion is already in memory.
deflate = { path = "../../deflate" }

[lints]
workspace = true
