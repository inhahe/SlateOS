# The third-party code userspace/file carries (design-decisions 1433), read by
# scripts/gather-notices.py.
#
# The crate is a port of file 5.45 and its libmagic, source file by source
# file -- src/softmagic.rs follows src/softmagic.c, and so on -- and its magic
# database is file 5.45's own (magic/, vendored by
# scripts/file-magic-vendor.py). So file's licence travels with it, and so do
# the copyright notices at the head of the sources it follows, which name
# different holders and years: file-source-notices lists them, each under
# file-COPYING's terms.
file:
  version: 5.45
  licence: BSD-2-Clause
  texts:
    - file-COPYING
    - file-source-notices

# src/fmtcheck.rs follows the fmtcheck.c file 5.45 carries from NetBSD, whose
# notice is the NetBSD Foundation's.
NetBSD fmtcheck:
  licence: BSD-2-Clause
  texts:
    - netbsd-fmtcheck-COPYRIGHT

# src/zlib.rs is not zlib's code: it is written to give the answers zlib's
# inflate gives, because `file -z` prints them -- its messages word for word.
# zlib's notice is given for those.
zlib:
  version: 1.3
  licence: Zlib
  texts:
    - zlib-LICENSE
