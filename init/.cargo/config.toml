# Zone config for init/ — init and the service manager.
#
# Cargo's config search walks up from the current working directory.
# When you run `cargo build` from inside init/, cargo merges this
# config with the workspace-root .cargo/config.toml. Scalar settings
# (like `build.target`) here override the kernel-default in the parent;
# the parent's `[target.x86_64-slateos]` rustflags are additively
# merged.
#
# YOU MUST SAY `cargo +nightly build`. The default toolchain here is
# stable, and cargo on stable *silently ignores* the whole `[unstable]`
# table — including the workspace root's `json-target-spec = true`,
# without which `build.target` below (a `.json` spec) is rejected:
#
#     error: `.json` target specs require -Zjson-target-spec
#
# That message names a flag you cannot pass, which is why it is worth
# stating here: the fix is not to add `-Z` anywhere, it is `+nightly`.
# From the workspace root the equivalent is the `build-slateos` alias,
# also nightly-only. See known-issues.md
# TD-C-A-ZONE-BUILD-FAILS-UNLESS-YOU-KNOW-TO-SAY-NIGHTLY.
#
# The target's family is `unix` and the development host is Windows, so
# `cargo test` on the host never compiles the `#[cfg(unix)]` half of
# any file here — a build from this directory is the only thing that
# does.
#
# build-std is set here (not at the workspace root) because cargo
# *appends* arrays during config merge — if the parent set build-std,
# the kernel build (which runs from kernel/ and would inherit the
# parent) would also be forced to rebuild std and fail.

[build]
target = "../toolchain/x86_64-slateos.json"

[unstable]
build-std = ["core", "alloc", "std", "panic_abort"]
