[package]
name = "snippets"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let app = App::new(); let _cmds =
# app.render();` — it built the library, drew one frame into a `Vec` nobody
# displayed and returned, so nothing ever reached a screen and no key or click
# ever arrived.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
