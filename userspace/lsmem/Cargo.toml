[package]
name = "lsmem"
version = "0.1.0"
edition = "2024"
description = "lsmem, util-linux 2.39.3's, ported: memory blocks from /sys in a libsmartcols table"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long, as every util-linux program parses its options.
getoptlong = { path = "../getoptlong" }
# argv and file names are bytes; a diagnostic escapes what is unprintable.
quoting = { path = "../quoting" }
# strerror(3)'s wording for a failed call.
errmsg = { path = "../errmsg" }
# util-linux's close_stdout, and stdout buffered as glibc buffers it.
ulclosestream = { path = "../ulclosestream" }
# libsmartcols: the table, and the terminal query lsmem's errno depends on.
smartcols = { path = "../smartcols" }
# A stdout the process was started without stays closed, as upstream sees it:
# `lsmem -a >&-` is a write error there, and the runtime's /dev/null hides it.
stdfdguard = { path = "../stdfdguard" }
# strutils.c: size_to_human_string, string_add_to_idarray, strtoumax's
# scanner; and glibc's strverscmp for scandir's versionsort.
ulstrutils = { path = "../ulstrutils" }

[dev-dependencies]
scratchdir = { path = "../scratchdir" }
