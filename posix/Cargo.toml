[package]
name = "posix"
version = "0.1.0"
edition = "2024"
description = "POSIX compatibility library — C-compatible function signatures backed by native syscalls"

[lib]
# staticlib is for linking into OS userspace programs; rlib is for tests.
# `cargo test` only uses the rlib.
crate-type = ["staticlib", "rlib"]

# The POSIX `TZ`-string engine. Shared with `userspace/oils` so the shell's
# `printf '%(FMT)T'` and the libc's `strftime` can never disagree about local
# time; see tzrules/src/lib.rs's "Why this is a crate and not a module".
[dependencies]
tzrules = { path = "../tzrules" }
# The implementations behind <math.h>: rust-lang's port of musl's libm,
# vendored exactly as crates.io publishes it (posix/vendor/README.md,
# design-decisions.md section 1132). math.rs is the C ABI and glibc's errno
# over it. Default features: "arch" lets it use SSE2's sqrt, which is exact.
# "unstable-public-internals" exports `support::hf64`/`hf32`, the const
# hex-float parsers lgamma.rs spells CORE-MATH's constants with, as its C
# does; it changes no code, only what is visible.
libm = { path = "vendor/libm", features = ["unstable-public-internals"] }

# The journal record's one spelling. `syslog.rs` writes it with an escaper of
# its own -- the libc has no allocator for this crate's `String`s -- and its
# tests hold that copy to this original, byte for byte.
[dev-dependencies]
journalrec = { path = "../userspace/journalrec" }

[lints]
workspace = true
