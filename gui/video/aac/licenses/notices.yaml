# The third-party code gui/video/aac carries, read by
# scripts/gather-notices.py: one entry per upstream project, with the texts
# that must travel with any binary built from the crate.

# The decoder is FFmpeg's fixed-point AAC decoder translated into Rust,
# module by module, from FFmpeg 8.1.3's libavcodec: mpeg4audio.c
# (src/mpeg4audio.rs) and the rest as src/lib.rs lists. FFmpeg is LGPL
# version 2.1 or later; the translation is too (design-decisions/1377: the
# operator chose to translate FFmpeg's decoder, F-Q9).
FFmpeg:
  version: n8.1.3
  licence: LGPL-2.1-or-later
  texts:
    - FFmpeg-COPYING.LGPLv2.1
