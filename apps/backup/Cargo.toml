[package]
name = "backup-app"
version = "0.1.0"
edition = "2024"

[dependencies]
# The content-addressed blob store treats a file's presence at a hash-derived
# path as proof that the hash's content is there, so a blob must never appear
# at its final name until it is complete.
safeio = { path = "../safeio" }

# The same crate again with its `audit` counters on, so the tests can prove the
# store's writes really went through `safeio` and did not quietly regress to
# `std::fs::write`/`fs::copy`. Cargo unifies this with the dependency above when
# building tests, so the counters cost nothing in the shipped binary.
[dev-dependencies]
safeio = { path = "../safeio", features = ["audit"] }

[lints]
workspace = true
