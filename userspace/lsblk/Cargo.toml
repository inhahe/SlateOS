[package]
name = "lsblk"
version = "0.1.0"
edition = "2024"
description = "util-linux 2.39.3's lsblk, ported: block devices from sysfs as a tree or a list, through the libsmartcols, libmount and libblkid ports"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long, with util-linux's mutually exclusive options.
getoptlong = { path = "../getoptlong" }
# argv and paths are bytes; a name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# libsmartcols: the table, its tree, group chart and sorting.
smartcols = { path = "../smartcols" }
# libmount: the mount table and swaps, for MOUNTPOINT(S) and FSROOTS; and
# libudev's database, for FSTYPE, LABEL, UUID and the rest.
ulmount = { path = "../ulmount" }
# libblkid: the same, probed from the device when udev knows nothing.
ulblkid = { path = "../ulblkid" }
# lib/path.c and lib/sysfs.c: /sys/dev/block/MAJ:MIN and its attributes.
ulsysfs = { path = "../ulsysfs" }
# size_to_human_string, string_add_to_idarray, err_exclusive_options,
# strtou32_or_err and strtoul's digit scan.
ulstrutils = { path = "../ulstrutils" }
# util-linux's close_stdout, and stdout buffered as glibc buffers it.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor lsblk was started without stays closed.
stdfdguard = { path = "../stdfdguard" }

[dev-dependencies]
scratchdir = { path = "../scratchdir" }
