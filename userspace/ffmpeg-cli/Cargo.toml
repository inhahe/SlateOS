[package]
name = "ffmpeg-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# It interpolates `file` into "Input #0, mov,mp4,m4a,3gp, from {}:". That
# value is a path from the command line, and a path may hold any byte but
# `/` and NUL -- a newline included.
quoting = { path = "../quoting" }
