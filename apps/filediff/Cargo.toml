[package]
name = "filediff"
version = "0.1.0"
edition = "2024"
description = "SlateOS File Diff/Compare Tool — side-by-side, unified, and inline diff views with merge support"
[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# A capped read, so opening a multi-gigabyte file does not take the
# window down -- and says so when it cuts one.
safeio = { path = "../safeio" }
diffcore = { path = "../diffcore" }
# `is_plain`, `is_ctrl_chord`, `types_into_field`: Ctrl chords, Alt alone and plain keys, each as itself.
textline = { path = "../textline" }

[dev-dependencies]
# A private folder per test, for comparing two real folders.
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
