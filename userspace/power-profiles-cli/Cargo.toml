[package]
name = "power-profiles-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# It interpolates `profile` into "powerprofilesctl: set profile to {}". That
# value is a path from the command line, and a path may hold any byte but
# `/` and NUL -- a newline included.
quoting = { path = "../quoting" }
