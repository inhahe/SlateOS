[package]
name = "whiteboard"
version = "0.1.0"
edition = "2024"

[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
oswindow = { path = "../../gui/window" }
# Whether a key is a Ctrl chord, or Alt's or the Windows key's: the one
# statement of each, where this file had its own.
textline = { path = "../textline" }

# The export replaces a file the user chose. `fs::write` truncates the
# target before writing it.
safeio = { path = "../safeio" }
# A board's own file: YAML, as `apps/slides` keeps a deck -- the tree's format
# for anything a person might open in an editor.
yamldoc = { path = "../../yamldoc" }
# "Unsaved changes -- save them?", asked the way every editor here asks it.
unsaved = { path = "../unsaved" }

[lints]
workspace = true
