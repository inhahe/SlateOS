[package]
name = "ere"
version = "0.1.0"
edition = "2024"
description = "POSIX regular expressions (BRE and ERE) over byte strings, for the shell and the utilities that must agree with it."

[lib]
path = "src/lib.rs"

[dependencies]
# The same `bstr` the shell uses, for one thing only: `char_indices`, whose
# lossy decode plus the span it covers is what lets `ch` tell "the value really
# holds U+FFFD" apart from "this byte decodes to nothing". Re-deriving that by
# hand would be a second UTF-8 decoder that has to agree with the shell's
# exactly, which is the kind of divergence this crate exists to prevent.
#
# No features at all, not even `alloc`: `char_indices` is a decoder over a
# `&[u8]` and wants neither. It used to be `features = ["std"]`, which is the
# single line that kept `kernel` from linking this crate at all — see the
# `no_std` section of `src/lib.rs`.
#
# Asking for nothing is necessary and not sufficient, because Cargo *unions* a
# dependency's features across everything in one build graph, and `oils` is in
# this workspace asking the same `bstr` for `alloc`. That union is harmless
# because it is `alloc` — which this crate could have asked for itself — and
# stays harmless only while nobody puts `bstr/std` back. If a third consumer
# ever needs `bstr/std`, it has to be a separate build graph from the kernel's,
# not a separate `features` line.
bstr = { version = "1.13.0", default-features = false }

[lints]
workspace = true
