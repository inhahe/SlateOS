[package]
name = "semgrep-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# It interpolates `path` into "Scanning {} with config {}...". That value is
# a path from the command line, and a path may hold any byte but `/` and NUL
# -- a newline included. It interpolates `config` into "Scanning {} with
# config {}...". That value is a path from the command line, and a path may
# hold any byte but `/` and NUL -- a newline included.
quoting = { path = "../quoting" }
