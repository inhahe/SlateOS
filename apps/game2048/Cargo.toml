[package]
name = "game2048"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The game generated a board, dropped it and exited: `main` was
# `let _app = Game2048App::new();`. `oswindow` is what makes the difference
# between a simulation and a program.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
