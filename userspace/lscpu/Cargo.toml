[package]
name = "lscpu"
version = "0.1.0"
edition = "2024"
description = "lscpu, util-linux 2.39.3's, ported: the CPU architecture from /proc and /sys, in a libsmartcols table"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long: GNU order, abbreviations, optional arguments.
getoptlong = { path = "../getoptlong" }
# argv is bytes; a name in a diagnostic is escaped; paths from bytes.
quoting = { path = "../quoting" }
# libsmartcols: the summary, -e and -C tables, and --json.
smartcols = { path = "../smartcols" }
# strtod, strtoimax, parse_size, size_to_human_string, string_add_to_idarray,
# err_exclusive_options: util-linux's lib/strutils.c and optutils.h.
ulstrutils = { path = "../ulstrutils" }
# stdout buffered as glibc buffers it, and close_stdout at exit.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor lscpu was started without stays closed.
stdfdguard = { path = "../stdfdguard" }

[dev-dependencies]
# Snapshot trees of /sys and /proc for the tests.
scratchdir = { path = "../scratchdir" }
