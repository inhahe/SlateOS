[package]
name = "pacman"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = PacmanApp::new();` — it built
# the maze, placed the four ghosts and dropped the lot, so no frame ever
# reached a screen and no arrow key ever arrived.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
