[package]
name = "coredumpctl"
version = "0.1.0"
edition = "2024"
description = "SlateOS coredumpctl utility"
[dependencies]
# It interpolates `output_path` into "Core dump written to {} ({}).". That
# value is a path from the command line, and a path may hold any byte but
# `/` and NUL -- a newline included.
quoting = { path = "../quoting" }
