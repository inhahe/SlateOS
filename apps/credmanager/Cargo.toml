[package]
name = "credmanager"
version = "0.1.0"
edition = "2024"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The vault -- its entries and its sealed file -- shared with the credential
# service, which reads it with the very code that writes it
# (requests/c-e-share-the-password-vault-with-the-credential-service.md).
credvault = { path = "../credvault" }
# The vault's cipher and its key derivation: XChaCha20-Poly1305 and Argon2id,
# vendored from RustCrypto (design-decisions.md §539, §1218). This crate
# checked its master password against pwkdf's verifier until 2026-09-27, and
# kept nothing on disk to check it against.
seal = { path = "../../rustcrypto/seal" }
# The vault's contents are tab-separated records, escaped the way every
# program's record files are.
textfmt = { path = "../../textfmt" }
# A fingerprint of the contents, to save exactly when they change.
sha2 = { path = "../../sha2" }
# Where the vault is kept: beside every other program's settings and data.
settingsfile = { path = "../../gui/settingsfile" }
# The vault written whole or not at all.
safeio = { path = "../safeio" }
# A path shown by its bytes, never a lossy decode.
pathtext = { path = "../pathtext" }
# The window itself: `app::launch` is what turns the renderer below into a
# program the desktop can open, rather than a struct with a `main` that returns.
oswindow = { path = "../../gui/window" }
# `is_plain`, `is_ctrl_chord`, `types_into_field`: a chord is neither a vault key nor typing.
textline = { path = "../textline" }

[dev-dependencies]
# Scratch folders for the vault file, so no test reads or writes a real one.
scratchdir = { path = "../../userspace/scratchdir" }
# The vault the cheapest key derivation opens, for this program's tests.
credvault = { path = "../credvault", features = ["testing"] }

[lints]
workspace = true
