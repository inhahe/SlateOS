[package]
name = "logviewer"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# The search's regular expressions: the POSIX engine grep and the shell use
# here, so a pattern means the same thing in the viewer as at the prompt.
ere = { path = "../../userspace/ere" }
# Where the system journal is, as the program that writes it says.
journalrec = { path = "../../userspace/journalrec" }
# An export is written atomically, like every other file an app writes.
safeio = { path = "../safeio" }

[lints]
workspace = true
