[package]
name = "getopt"
version = "0.1.0"
edition = "2024"
description = "SlateOS getopt - a port of util-linux's getopt(1), parsing options for shell scripts"

[lints]
workspace = true

[dependencies]
# glibc's getopt_long, with the knobs getopt(1) exposes: keep going, -a's
# getopt_long_only, one option per -l entry, W;.
getoptlong = { path = "../getoptlong" }
# Argument bytes, and names in diagnostics with their control bytes escaped.
quoting = { path = "../quoting" }
# util-linux's close_stdout: stdout buffered as glibc buffers it, a lost
# diagnostic counted, and status 3 (getopt's CLOSE_EXIT_CODE) for either.
ulclosestream = { path = "../ulclosestream" }
# A stdout or stderr the process was started without stays closed, as upstream
# sees it, rather than the runtime's /dev/null.
stdfdguard = { path = "../stdfdguard" }
