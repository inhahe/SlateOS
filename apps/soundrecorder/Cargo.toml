[package]
name = "soundrecorder"
version = "0.1.0"
edition = "2024"
[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Recordings are read and written as WAV -- a take stored exactly, markers as
# `cue ` chunks, a kept part cut without decoding -- and saved without ever
# replacing a file nobody chose to replace.
wavpcm = { path = "../wavpcm" }
safeio = { path = "../safeio" }

[lints]
workspace = true
