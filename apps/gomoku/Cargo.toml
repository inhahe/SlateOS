[package]
name = "gomoku"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = GomokuApp::new();` -- it built
# the opening board, dropped it and exited, so no stone ever reached a screen
# and no click ever arrived at the game that reads clicks.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
