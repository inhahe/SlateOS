[package]
name = "asteroids"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = AsteroidsApp::new();` — it
# built the ship, spawned the first wave and dropped the lot, so no frame ever
# reached a screen and no key ever arrived.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }
# `is_plain`: a key pressed with Alt or the Windows key is not the game's.
textline = { path = "../textline" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }
# `legibility`: every text reads on what is drawn under it.
gamechrome = { path = "../gamechrome" }

[lints]
workspace = true
