[package]
name = "crc32"
version = "0.1.0"
edition = "2024"
description = "CRC-32 (ISO 3309 / IEEE 802.3), written once, checked against the standard check value."

[lib]
path = "src/lib.rs"

# `no_std` with no `alloc`, like `sha2`, `sha1` and `md5`: the state is a single
# `u32` and the table is a `const`, so there is nothing to allocate. That
# matters here because the callers have nothing in common except needing this
# polynomial — the kernel's gzip/ZIP/RAR/7-Zip/F2FS paths, the `deflate` crate,
# and the GUI-side image codecs that verify PNG chunk CRCs.
[dependencies]

[lints]
workspace = true
