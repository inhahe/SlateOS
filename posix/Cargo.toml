[package]
name = "posix"
version = "0.1.0"
edition = "2024"
description = "POSIX compatibility library — C-compatible function signatures backed by native syscalls"

[lib]
# staticlib is for linking into OS userspace programs; rlib is for tests.
# `cargo test` only uses the rlib.
crate-type = ["staticlib", "rlib"]

# The POSIX `TZ`-string engine. Shared with `userspace/oils` so the shell's
# `printf '%(FMT)T'` and the libc's `strftime` can never disagree about local
# time; see tzrules/src/lib.rs's "Why this is a crate and not a module".
[dependencies]
tzrules = { path = "../tzrules" }

[lints]
workspace = true
