[package]
name = "contacts"
version = "0.1.0"
edition = "2024"
description = "SlateOS Contacts — address book and contact manager"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
# The address book had no way in. `main` built a store, drew one frame into a
# `Vec` and dropped it, so every control below -- the `+` button, the search
# bar, the A-Z rail, the rows, Edit, Star, Delete, Save, Cancel, Merge -- was
# a painted rectangle that answered nothing. `oswindow` is the door.
oswindow = { path = "../../gui/window" }

# The address book and every export are written through
# `safeio::write_str_atomically`, not `fs::write`, which truncates the target
# before writing it: an interrupted save would leave the book as a fragment.
safeio = { path = "../safeio" }

# The address book is kept in the user's settings directory
# (`settingsfile::config_dir`), as the notes library and the finance ledger are.
settingsfile = { path = "../../gui/settingsfile" }

# The book's text fields are escaped with `textfmt::tsv`, the record files'
# four escapes, which the ledger, the workbook and the notes library share.
textfmt = { path = "../../textfmt" }

# "Save the contact being edited before closing?", asked the way every editor
# here asks it.
unsaved = { path = "../unsaved" }

[dev-dependencies]
# `with_scratch_config`, so the tests that keep a book keep it in a scratch
# directory and never in the developer's own.
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }

[lints]
workspace = true
