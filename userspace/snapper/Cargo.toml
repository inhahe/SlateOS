[package]
name = "snapper"
version = "0.1.0"
edition = "2024"
[dependencies]
# One rendering of untrusted text inside a diagnostic. Config names,
# subcommands, cleanup-algorithm names and snapshot-number strings all come
# straight off the command line, and a command line may hold a newline -- so a
# message that pastes one in raw lets whoever wrote the argv write extra lines
# of this program's output. See `userspace/quoting`.
quoting = { path = "../quoting" }
