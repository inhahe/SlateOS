[package]
name = "reminders"
version = "0.1.0"
edition = "2024"
[dependencies]
pathtext = { path = "../pathtext" }
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }

# The app-facing compositor client. An app names `oswindow` and never
# `guiremote`, for the reason a Unix program does not name the socket layer.
oswindow = { path = "../../gui/window" }

# Ctrl+S writes through `safeio::write_str_atomically`, not `fs::write`, which
# truncates the target before writing it -- and the file being replaced is very
# often the only copy of the list.
safeio = { path = "../safeio" }

# The zone rules, so "overdue" is judged against the user's clock rather
# than a private copy of the calendar in this crate.
tzrules = { path = "../../tzrules" }

# Where the reminders are kept (the settings folder), and the escapes their
# text is written with -- as the notes library and the calendar keep theirs.
settingsfile = { path = "../../gui/settingsfile" }
textfmt = { path = "../../textfmt" }

# The keys a one-line field answers, for the reminder form.
textline = { path = "../textline" }

# "Your latest changes are not saved", asked the way every editor here asks.
unsaved = { path = "../unsaved" }

# Two windows of Reminders save into one list without losing each other's
# reminders: random ids, a merge by id, and a watch on the file
# (design-decisions §1239).
recordfile = { path = "../recordfile" }

[dev-dependencies]
settingsfile = { path = "../../gui/settingsfile", features = ["testing"] }
# `refuse_replacing`, so a test can fail a save at the write with the list
# still readable: a save reads the file first (design-decisions §1239).
safeio = { path = "../safeio", features = ["testing"] }

[lints]
workspace = true
