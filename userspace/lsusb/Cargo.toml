[package]
name = "lsusb"
version = "0.1.0"
edition = "2024"
description = "SlateOS USB device lister"
[dependencies]
# It interpolates `args[i + 1]` into "error: unknown USB class: {}". That
# value is an argv word, so it is whatever the user typed and not text this
# program chose.
quoting = { path = "../quoting" }
