[package]
name = "sokoban"
version = "0.1.0"
edition = "2024"

[dependencies]
# The toolkit's buttons at a game's size (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = SokobanApp::new();` — it parsed
# fifteen levels, loaded the first, dropped the lot and exited, so no warehouse
# ever reached a screen and no key or click ever arrived.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
