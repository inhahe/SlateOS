[package]
name = "imagecodec"
version = "0.1.0"
edition = "2024"
description = "Decoding picture files into the pixels the compositor draws, without trusting the file."

[lib]
path = "src/lib.rs"

# `no_std` + `alloc`, and dependent on nothing that is part of the GUI, for the
# same reason as `yamldoc`, `textfmt` and `textfind`: the components that need to
# turn a file into pixels are not all GUI components. The desktop shell's
# wallpaper and the file manager's thumbnails are, but the preview/thumbnail
# engine and anything that wants an image's real dimensions are not, and none of
# them should have to take a dependency on a widget library to read a PNG.
#
# That property is about the *direction* of the dependency, not the count. Until
# 2026-08-26 this crate carried its own DEFLATE decoder, which was the second one
# in the tree; `deflate` is now a crate of its own (see
# `requests/a-c-deflate-is-a-crate-now.md`), it is `no_std` + `alloc` too, and it
# depends only on `crc32`. So depending on it costs the widget-freedom nothing
# and buys the deletion of 872 lines that had to be right about RFC 1951 twice.
# `crc32`, the checksum on every PNG chunk, is the same kind of leaf: `no_std`,
# no allocator, no dependencies; this crate kept a private copy of its table
# until 2026-09-26.
[features]
# AVIF decoding: the AV1 decoder and the conversion of its frames to pixels.
# Without it the AVIF container is still read -- `dimensions` and
# `pixel_format` work -- and `decode` reports the format unsupported. On by
# default; `osfont`, which decodes only PNG glyphs, turns it off, so that a
# font renderer does not build a video decoder.
default = ["avif"]
avif = ["dep:rav1d"]

[dependencies]
crc32 = { path = "../../crc32" }
deflate = { path = "../../deflate" }
# dav1d in Rust, vendored in lane F's `gui/video/` (see its VENDORED.md). The
# one dependency here that is not `no_std`: it runs its own threads.
rav1d = { path = "../video/rav1d", optional = true }

[lints]
workspace = true
