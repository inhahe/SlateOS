[package]
name = "ssh"
version = "0.1.0"
edition = "2024"
description = "SlateOS SSH-2 client"

# `sha2` for the key exchange, HMAC and host-key fingerprints. This crate
# carried its own SHA-256; in a protocol client that is a private protocol,
# since every one of those digests has to agree with the far end.
#
# `posix` for `ed25519` (verifying the server's host key signature), which was a
# placeholder: the signature was not checked at all.
#
# `posix` is depended on for `ed25519` *only*, and that is a deliberate limit.
# `ed25519` is pure arithmetic over caller-owned buffers, which is what makes it
# safe to reach as a Rust dependency. Anything in `posix` that talks to the
# kernel is not: a SlateOS program target is `target_os = "linux"`, every
# syscall in `posix` is gated `#[cfg(target_os = "none")]` for the bare-metal
# `libc.a` build, so an rlib copy of `posix` linked into a program answers
# `-ENOSYS` to every syscall while the real libc sits right next to it answering
# correctly. See known-issues.md
# `TD-B-THE-POSIX-RLIB-IS-A-SECOND-LIBC-WITH-EVERY-SYSCALL-STUBBED-OUT`.
#
# `randrange` for the two secrets this crate draws -- the Diffie-Hellman private
# exponent and the X11 MIT-MAGIC-COOKIE. The exponent was two hard-coded
# constants hashed together, one secret shared by every copy of the binary.
# `randrange` reaches the kernel CSPRNG through the linked libc's `getrandom`
# symbol, which is the one route that works from a program, and is shared with
# `sshd` and `ssh-keygen` so there is one implementation rather than three.
#
# `sshwire` for the encodings and the key-exchange arithmetic the server has to
# agree with byte for byte. It is the `sha2` argument one layer up: this crate
# and `userspace/sshd` each had a private copy of the RFC 4253 section 8 exchange
# hash, the server's drifted to hashing a placeholder client version, and this
# client -- doing everything right -- could not verify any signature it got.
# Both suites were green. See known-issues.md
# `TD-B-THE-SSH-WIRE-LAYER-IS-WRITTEN-TWICE-AND-NOTHING-MAKES-THE-TWO-COPIES-AGREE`.
[dependencies]
# The host name added to known_hosts comes from the command line or from the
# ssh config file, so it is not text ssh chose.
quoting = { path = "../quoting" }
sha2 = { path = "../../sha2" }
posix = { path = "../../posix" }
randrange = { path = "../../randrange" }
sshwire = { path = "../sshwire" }

# Inherit the workspace lint configuration. This crate carried its own
# `#![deny(clippy::all)]` and nothing else, which is the easy half: it left
# `unwrap_used`, `expect_used`, `indexing_slicing` and
# `arithmetic_side_effects` off over code that parses SSH-2 binary packets --
# including the ones exchanged before the server has been authenticated -- and
# whose module header used to justify that with "panics are acceptable failure
# modes (the process just exits)". For a network client a panic reachable from
# a server's bytes is a remote denial of service, not a tidy exit.
# See known-issues.md `TD-B-USERSPACE-CRATES-DO-NOT-INHERIT-THE-WORKSPACE-LINTS`.
# Test-only. `-o UserKnownHostsFile=` is tested against a real file, and a real
# file in a test needs a private directory that goes away afterwards — the
# alternative being a clock-named temp path, which is not unique and which only
# gets cleaned up when the test passes. See that crate's module docs.
[dev-dependencies]
scratchdir = { path = "../scratchdir" }

# `deterministic-secrets` exposes `SshSession::with_secret_source`, which lets a
# caller replace the source this client draws its Diffie-Hellman exponent,
# KEXINIT cookie and packet padding from.
#
# It is a Cargo feature rather than a plain `pub fn` because a feature is
# *absent* from a build that does not ask for it, and the only thing that asks
# is the interop test crate, through its `dev-dependencies`. A release artifact
# does not compile dev-dependencies, so it does not contain this method at all
# -- a stronger statement than "nothing calls it", and the right strength for a
# method whose misuse is a client negotiating a key an observer can predict.
# `cfg(test)` cannot serve here because it is per-crate, and the interop test is
# a different crate.
#
# Nothing in any crate's `[dependencies]` enables it, so no ordinary build can
# turn it on through feature unification.
[features]
deterministic-secrets = []

# This crate is a library with a three-line binary on top, and the split is
# load-bearing rather than cosmetic: a binary crate has no rlib for another
# crate to link, so while the client was a `main.rs` no test could drive it
# against the real server. Six bugs have now come out of the two ends of this
# protocol disagreeing while each end's own suite passed. See the library's
# module docs and known-issues.md
# `TD-B-THE-SSH-WIRE-LAYER-IS-WRITTEN-TWICE-AND-NOTHING-MAKES-THE-TWO-COPIES-AGREE`.
[lib]
name = "ssh"
path = "src/lib.rs"

[[bin]]
name = "ssh"
path = "src/main.rs"

[lints]
workspace = true
