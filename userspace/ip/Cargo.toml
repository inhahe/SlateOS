[package]
name = "ip"
version = "0.1.0"
edition = "2024"
description = "SlateOS network interface and routing configuration utility"
[dependencies]
# It interpolates `iface_name` into "Interface {} not found". That value is
# an argv word, so it is whatever the user typed and not text this program
# chose.
quoting = { path = "../quoting" }
# The kernel's native error codes: SYS_NET_IF_CONFIG refuses with its own
# numbers (PermissionDenied is -400), not Linux's errno.
kerror = { path = "../kerror" }
