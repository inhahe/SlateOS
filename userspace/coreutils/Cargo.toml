[package]
name = "coreutils"
version = "0.1.0"
edition = "2024"
description = "Coreutils for SlateOS (86 binaries)"

[dependencies]
# One regex engine for the utilities and the shell. `grep`, `sed`, `awk` and
# `expr` each used to match regular expressions with `str::contains`, so a
# bracket expression matched only a line that literally contained `[ax]` — and
# `[[ $f =~ ^a ]]` in osh and `grep '^a'` gave different answers about one file.
# See design-decisions.md §322.
ere = { path = "../ere" }
# One definition of an exact integer, shared with `bc`, `dc` and `genius-cli`.
# GNU `expr` is arbitrary-precision — `expr 9223372036854775807 + 1` answers
# 9223372036854775808 — and a shell script reaches those sizes by accident.
bignum = { path = "../bignum" }
# One `wcwidth`, shared with the shell. `wc -L` reports a *display* width, not a
# character count — U+4E00 takes two columns and a combining mark takes none —
# and so do `expand`, `fold`, `nl` and `column`. All of them are laying text out
# on the same terminal as osh's `select` menu, so a disagreement about how wide
# a character is shows up as a misaligned screen. See `userspace/charwidth`.
charwidth = { path = "../charwidth" }
# One SHA-256, shared with `pkg`, `backup`, `rsync`, `ssh` and the rest. The
# `sha256sum` binary carried its own, which is the least defensible place for a
# private copy: the whole output of that utility is a digest another machine
# will compare against its own.
sha2 = { path = "../../sha2" }
