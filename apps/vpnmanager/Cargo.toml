[package]
name = "vpnmanager"
version = "0.1.0"
edition = "2024"

[dependencies]
# The user's colours, per design-decisions 822.
appearance = { path = "../../gui/appearance" }
guitk = { path = "../../gui/toolkit" }
oswindow = { path = "../../gui/window" }

# The export replaces a file of the user's VPN profiles. `fs::write`
# truncates the target first, so an interrupted write leaves neither the
# old profiles nor the new ones.
safeio = { path = "../safeio" }

[dev-dependencies]
# Import and Export drive a real file chooser over a real directory listing, so
# the round-trip tests need a directory that is theirs alone and goes away when
# they end -- including when they fail, which is the case a cleanup line at the
# bottom of a test body structurally cannot cover.
scratchdir = { path = "../../userspace/scratchdir" }

[lints]
workspace = true
