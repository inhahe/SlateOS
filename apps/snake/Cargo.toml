[package]
name = "snake"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = SnakeApp::new();` — it built the
# board, placed the first food and dropped the lot, so no frame ever reached a
# screen and no key ever arrived.
oswindow = { path = "../../gui/window" }
randrange = { path = "../../randrange" }

[lints]
workspace = true
