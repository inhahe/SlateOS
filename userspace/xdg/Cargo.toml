[package]
name = "xdg"
version = "0.1.0"
edition = "2024"
description = "SlateOS xdg-open/xdg-mime/mimeopen - file association tools"
[dependencies]
# One rendering of untrusted text inside a diagnostic. The file or URL
# xdg-open is handed, the MIME type looked up for it and the handler program
# it resolves to are all attacker-influenceable -- the MIME type is derived
# from the name, and a name may hold a newline. A message that pastes one in
# raw lets whoever named the file write extra lines of this program's
# output. See `userspace/quoting`.
quoting = { path = "../quoting" }
