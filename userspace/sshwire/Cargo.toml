[package]
name = "sshwire"
version = "0.1.0"
edition = "2024"
description = "SSH-2 wire encoding and key-exchange arithmetic, shared by ssh and sshd"

# `sha2` because every value this crate computes is a digest that has to agree
# with the far end of a connection. It is the same argument that already moved
# SHA-256 out of both `ssh` and `sshd`; this crate is that argument applied one
# layer up, to the constructions built *on* the digest.
[dependencies]
sha2 = { path = "../../sha2" }

[lints]
workspace = true
