[package]
name = "mahjong"
version = "0.1.0"
edition = "2024"

[dependencies]
# The chrome every game draws in the user's theme (C-Q16, §1422).
gamechrome = { path = "../gamechrome" }
# The undo history: the toolkit's tree, kept of whole boards (C-Q24).
statehistory = { path = "../statehistory" }
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` was `let _app = Mahjong::new();` -- it dealt a
# 144-tile turtle into a struct and dropped it, so no tile ever reached a screen
# and no click ever arrived.
oswindow = { path = "../../gui/window" }

[dev-dependencies]
# `palette_check`: the window is drawn from the palette.
appearance = { path = "../../gui/appearance", features = ["testing"] }

[lints]
workspace = true
