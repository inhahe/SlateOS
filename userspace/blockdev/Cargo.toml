[package]
name = "blockdev"
version = "0.1.0"
edition = "2024"
description = "util-linux 2.39.3's blockdev, ported: call block device ioctls from the command line"

[lints]
workspace = true

[dependencies]
# argv and paths are bytes; a name in a diagnostic is escaped.
quoting = { path = "../quoting" }
# lib/blkdev.c: the requests, blkdev_get_size and blkdev_get_sectors.
ulblkid = { path = "../ulblkid" }
# lib/sysfs.c: where a partition starts, for --report.
ulsysfs = { path = "../ulsysfs" }
# strtos32_or_err for --setbsz, --setra and --setfra.
ulstrutils = { path = "../ulstrutils" }
# util-linux's close_stdout, and stdout buffered as glibc buffers it.
ulclosestream = { path = "../ulclosestream" }
# A standard descriptor blockdev was started without stays closed.
stdfdguard = { path = "../stdfdguard" }
