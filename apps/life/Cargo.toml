[package]
name = "life"
version = "0.1.0"
edition = "2024"

[dependencies]
guitk = { path = "../../gui/toolkit" }
# The window. Without it `main` built a `LifeApp`, dropped it and exited: no
# board ever reached a screen and no key ever arrived — which is how both key
# handlers could swallow `pressed` and run every key twice, so that Space
# started and stopped the simulation between one frame and the next and the
# Game of Life could not advance a single generation.
oswindow = { path = "../../gui/window" }

[lints]
workspace = true
