[package]
name = "eject"
version = "0.1.0"
edition = "2024"
description = "SlateOS eject utility"
[dependencies]
procinfo = { path = "../../procinfo" }
# The device path is an argv word, and the unknown-option message echoes the
# offending argument itself.
quoting = { path = "../quoting" }

# Reading a sysfs attribute must tell an ABSENT one from an UNREADABLE
# one. `read_to_string(..).unwrap_or_default()` answers the same empty
# string for both, so a drive whose `device/model` exists but cannot be
# read reported no model at all -- indistinguishable from a drive that
# does not publish one.
optionalfile = { path = "../../optionalfile" }
